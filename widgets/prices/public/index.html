<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      color-scheme: light dark;
      --pl-text: #1a1a1a;
      --pl-muted: #767676;
      --pl-border: #e0e0e0;
      --pl-bg: #ffffff;
      --pl-chip-bg: #f2f2f2;
      --pl-accent: #0277bd;
      --pl-vcheap: #2e7d32;
      --pl-cheap: #66bb6a;
      --pl-normal: #9e9e9e;
      --pl-exp: #fb8c00;
      --pl-vexp: #d32f2f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --pl-text: #f2f2f2; --pl-muted: #a0a0a0; --pl-border: #3a3a3a; --pl-bg: #1e1e20;
        --pl-chip-bg: #2a2a2a; --pl-accent: #4fc3f7; --pl-vcheap: #66bb6a; --pl-cheap: #81c784;
        --pl-normal: #8d8d8d; --pl-exp: #ffa726; --pl-vexp: #ef5350;
      }
    }
    .homey-dark-mode {
      --pl-text: #f2f2f2; --pl-muted: #a0a0a0; --pl-border: #3a3a3a; --pl-bg: #1e1e20;
      --pl-chip-bg: #2a2a2a; --pl-accent: #4fc3f7; --pl-vcheap: #66bb6a; --pl-cheap: #81c784;
      --pl-normal: #8d8d8d; --pl-exp: #ffa726; --pl-vexp: #ef5350;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px; color: var(--pl-text); background: var(--pl-bg); padding: 10px 12px 10px;
    }
    .tabs { display: flex; gap: 6px; }
    .tab {
      flex: 1; border: none; background: var(--pl-chip-bg); color: var(--pl-text); border-radius: 8px;
      padding: 6px 8px; font-size: 12px; font-weight: 600; -webkit-tap-highlight-color: transparent;
    }
    .tab.active { background: var(--pl-accent); color: #fff; }
    .tab:disabled { opacity: .45; }
    .blocks { margin-top: 8px; font-size: 11px; color: var(--pl-muted); display: flex; flex-direction: column; gap: 2px; }
    .blocks b { font-weight: 700; }
    .blocks .c b { color: var(--pl-vcheap); }
    .blocks .p b { color: var(--pl-vexp); }
    .grid { margin-top: 8px; display: grid; grid-auto-flow: column; gap: 4px; }
    .cell {
      display: flex; align-items: center; gap: 4px; padding: 0 6px; height: 30px; border-radius: 7px;
      background: var(--pl-chip-bg); border-left: 3px solid transparent; cursor: pointer; min-width: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .cell .t { color: var(--pl-muted); font-size: 10.5px; font-variant-numeric: tabular-nums; flex: 0 0 auto; }
    .cell .p { font-weight: 700; font-size: 12px; font-variant-numeric: tabular-nums; flex: 1 1 auto; text-align: right; }
    .cell .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; background: var(--pl-normal); }
    .cell.cheap { border-left-color: var(--pl-vcheap); }
    .cell.pricey { border-left-color: var(--pl-vexp); }
    .cell.past { opacity: .5; }
    .cell.now { outline: 2px solid var(--pl-accent); outline-offset: -2px; }
    .cell.sel { background: var(--pl-border); }
    .dot.very_cheap { background: var(--pl-vcheap); }
    .dot.cheap { background: var(--pl-cheap); }
    .dot.normal { background: var(--pl-normal); }
    .dot.expensive { background: var(--pl-exp); }
    .dot.very_expensive { background: var(--pl-vexp); }
    .detail { margin-top: 8px; padding: 6px 8px; border-radius: 8px; background: var(--pl-chip-bg); min-height: 44px; }
    .detail .title { font-size: 10.5px; color: var(--pl-muted); margin-bottom: 4px; }
    .quarters { display: flex; gap: 6px; }
    .q { flex: 1; text-align: center; padding: 3px 0; border-radius: 6px; background: var(--pl-bg); }
    .q .qt { display: block; font-size: 10px; color: var(--pl-muted); }
    .q .qp { font-weight: 700; font-size: 12px; font-variant-numeric: tabular-nums; }
    .q.now { outline: 2px solid var(--pl-accent); outline-offset: -2px; }
    .foot { margin-top: 6px; font-size: 10px; color: var(--pl-muted); display: flex; justify-content: space-between; gap: 8px; }
    .loading, .load-error, .no-device, .pending { text-align: center; color: var(--pl-muted); font-size: 12px; padding: 18px 0; }
    .load-error { color: var(--pl-vexp); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/javascript">
    var day = 'today';
    var selected = {};
    var lastJson = null;

    function esc(str) {
      return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function f1(v) { return typeof v === 'number' ? v.toFixed(1) : '–'; }

    function detailHtml(Homey, d, key) {
      var h = d.hours.filter(function (x) { return x.hour === key; })[0];
      if (!h) return '<div class="title">' + esc(Homey.__('priceList.tapHint')) + '</div>';
      return '<div class="title">' + esc(h.hour) + ' – ' + esc(String(parseInt(h.hour, 10) + 1).padStart(2, '0')) + ':00 · Ø ' + f1(h.avg) + ' Rp./kWh</div><div class="quarters">' +
        h.quarters.map(function (q) {
          return '<div class="q' + (q.isNow ? ' now' : '') + '"><span class="qt">' + esc(q.time) + '</span><span class="qp">' + f1(q.value) + '</span></div>';
        }).join('') + '</div>';
    }

    function render(Homey, data) {
      var root = document.getElementById('root');
      if (!data.paired) {
        root.innerHTML = '<div class="no-device">' + esc(Homey.__('priceList.noDevice')) + '</div>';
        return;
      }
      var days = {};
      data.days.forEach(function (d) { days[d.key] = d; });
      if (day === 'tomorrow' && !days.tomorrow.available) day = 'today';
      var d = days[day];

      var tabs = '<div class="tabs">' +
        '<button class="tab' + (day === 'today' ? ' active' : '') + '" data-day="today">' + esc(Homey.__('priceList.today')) + ' ' + esc(days.today.date) + '</button>' +
        '<button class="tab' + (day === 'tomorrow' ? ' active' : '') + '" data-day="tomorrow"' + (days.tomorrow.available ? '' : ' disabled') + '>' + esc(Homey.__('priceList.tomorrow')) + ' ' + esc(days.tomorrow.date) + '</button></div>';

      if (!d.available) {
        root.innerHTML = tabs + '<div class="pending">' + esc(Homey.__('priceList.tomorrowPending')) + '</div>';
      } else {
        // Default selection: the current hour today, nothing tomorrow.
        var now = d.hours.filter(function (h) { return h.isNow; })[0];
        var key = selected[day] !== undefined ? selected[day] : (now ? now.hour : null);
        var rows = Math.ceil(d.hours.length / 4);
        var cells = d.hours.map(function (h) {
          var cls = 'cell' + (h.cheap ? ' cheap' : '') + (h.pricey ? ' pricey' : '') + (h.isNow ? ' now' : '') + (h.isPast ? ' past' : '') + (h.hour === key ? ' sel' : '');
          return '<div class="' + cls + '" data-hour="' + esc(h.hour) + '"><span class="t">' + esc(h.hour.slice(0, 2)) + '</span><span class="p">' + f1(h.avg) + '</span><span class="dot ' + (h.level || '') + '"></span></div>';
        }).join('');
        root.innerHTML = tabs +
          '<div class="blocks">' +
            (d.cheapBlock ? '<span class="c">' + esc(Homey.__('priceList.blockLine')) + ': <b>' + d.cheapBlock.start + '–' + d.cheapBlock.end + '</b> · Ø ' + f1(d.cheapBlock.avg) + ' Rp.</span>' : '') +
            (d.cheapFromNow && d.cheapBlock && (d.cheapFromNow.start !== d.cheapBlock.start || d.cheapFromNow.end !== d.cheapBlock.end) ? '<span class="c">' + esc(Homey.__('priceList.fromNowLine')) + ': <b>' + d.cheapFromNow.start + '–' + d.cheapFromNow.end + '</b> · Ø ' + f1(d.cheapFromNow.avg) + ' Rp.</span>' : '') +
            (d.priciestBlock ? '<span class="p">' + esc(Homey.__('priceList.peakLine')) + ': <b>' + d.priciestBlock.start + '–' + d.priciestBlock.end + '</b> · Ø ' + f1(d.priciestBlock.avg) + ' Rp.</span>' : '') +
          '</div>' +
          '<div class="grid" id="grid" style="grid-template-rows: repeat(' + rows + ', 30px); grid-template-columns: repeat(4, minmax(0, 1fr));">' + cells + '</div>' +
          '<div class="detail" id="detail">' + detailHtml(Homey, d, key) + '</div>' +
          '<div class="foot"><span>' + esc(Homey.__('priceList.legend')) + '</span><span>' + esc(Homey.__('priceList.price')) + '</span></div>';

        document.getElementById('grid').addEventListener('click', function (e) {
          var cell = e.target.closest ? e.target.closest('.cell') : null;
          if (!cell) return;
          var h = cell.getAttribute('data-hour');
          selected[day] = selected[day] === h ? null : h;
          render(Homey, data);
        });
      }
      Array.prototype.forEach.call(root.querySelectorAll('.tab'), function (b) {
        b.addEventListener('click', function () {
          if (b.disabled) return;
          day = b.getAttribute('data-day');
          render(Homey, data);
        });
      });
    }

    function fetchPrices(Homey) {
      return Homey.api('GET', '/prices')
        .then(function (data) {
          var json = JSON.stringify(data);
          if (json === lastJson) return;
          lastJson = json;
          render(Homey, data);
        })
        .catch(function (err) {
          console.error(err);
          lastJson = null;
          document.getElementById('root').innerHTML = '<div class="load-error">' + esc(Homey.__('priceList.loadFailed')) + '</div>';
        });
    }

    function onHomeyReady(Homey) {
      try {
        document.getElementById('root').innerHTML = '<div class="loading">' + esc(Homey.__('priceList.loading')) + '</div>';
        Homey.ready({ height: 400 });
        fetchPrices(Homey);
        setInterval(function () { fetchPrices(Homey); }, 60000);
      } catch (err) {
        document.getElementById('root').innerHTML = '<div class="load-error">Widget error: ' + esc(err && err.message ? err.message : err) + '</div>';
        try { Homey.ready({ height: 400 }); } catch (e2) { /* nothing more to do */ }
      }
    }
  </script>
</body>
</html>
