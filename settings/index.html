    function interpolateColor(ratio) {
      var r = ratio < 0 ? 0 : (ratio > 1 ? 1 : ratio);
      var cheap = [46, 125, 50];
      var expensive = [211, 47, 47];
      var rgb = cheap.map(function (c, i) { return Math.round(c + (expensive[i] - c) * r); });
      return 'rgb(' + rgb.join(',') + ')';
    }

    // slots: [{time, value|price, ref, kwh, isNow, isPast}]; withKwh adds the import row.
    function chartHtml(slots, withKwh) {
      if (!slots || slots.length < 2) return '';
      var valueOf = function (s) { return typeof s.value === 'number' ? s.value : s.price; };
      var values = [];
      for (var i = 0; i < slots.length; i += 1) {
        if (typeof valueOf(slots[i]) === 'number') values.push(valueOf(slots[i]));
        if (typeof slots[i].ref === 'number') values.push(slots[i].ref);
      }
      if (!values.length) return '';
      var min = Math.min.apply(null, values);
      var max = Math.max.apply(null, values);
      var span = max - min;
      var pct = function (v) { return span > 0 ? (v - min) / span : 0.5; };

      var twoDays = slots.length > 100;
      var bars = slots.map(function (s, idx) {
        var v = valueOf(s);
        var hasValue = typeof v === 'number';
        var ratio = hasValue ? pct(v) : 0;
        var heightPct = hasValue ? Math.max(4, Math.round(ratio * 100)) : 4;
        var color = hasValue ? interpolateColor(ratio) : 'var(--st-border)';
        var classes = 'bar' + (s.isNow ? ' now' : '') + (s.isPast ? ' past' : '') + (twoDays && idx === 96 ? ' daybreak' : '');
        var title = s.time + (hasValue ? ': ' + v.toFixed(2) + ' Rp./kWh' : '');
        return '<div class="' + classes + '" style="height:' + heightPct + '%;background:' + color + '" title="' + escapeHtml(title) + '"></div>';
      }).join('');

      var pts = [];
      slots.forEach(function (s, idx) {
        if (typeof s.ref === 'number') pts.push((idx + 0.5) + ',' + (100 - Math.round(pct(s.ref) * 100)));
      });
      var refLine = pts.length > 1
        ? '<svg class="refline" viewBox="0 0 ' + slots.length + ' 100" preserveAspectRatio="none"><polyline points="' + pts.join(' ') + '" fill="none" stroke="var(--st-accent)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-dasharray="4 3"/></svg>'
        : '';

      // Price axis: highest and lowest value (Rp./kWh) and the reference line with its value.
      var refSlot = slots.filter(function (s) { return typeof s.ref === 'number'; })[0];
      var yLabels = '<div class="ylabels"><span>' + niceNum(max, 1) + ' Rp.</span><span>' + niceNum(min, 1) + '</span></div>' +
        (refSlot ? '<span class="reflabel" style="top: calc(6px + (100% - 12px) * ' + ((100 - pct(refSlot.ref) * 100) / 100).toFixed(3) + ')">' + escapeHtml(T.refShort) + ' ' + niceNum(refSlot.ref, 1) + '</span>' : '');

      var kwhRow = '';
      var maxKwh = 0;
      slots.forEach(function (s) { if (s.kwh > maxKwh) maxKwh = s.kwh; });
      if (maxKwh > 0) maxKwh = Math.max(maxKwh, 0.05); // avoid blowing up meter noise to full height
      var overlay = '';
      if (withKwh && maxKwh > 0) {
        var kLabel = (maxKwh >= 1 ? maxKwh.toFixed(1) : maxKwh.toFixed(2)) + ' kWh';
        kwhRow = '<div class="kwhlabel"><i class="swb"></i>' + escapeHtml(T.kwhLabel) + '</div>';
        overlay = '<div class="kover">' + slots.map(function (s, idx) {
          var h = s.kwh > 0 ? Math.max(5, Math.round((s.kwh / maxKwh) * 100)) : 0;
          return '<div class="kbar' + (twoDays && idx === 96 ? ' daybreak' : '') + '" style="height:' + h + '%" title="' + escapeHtml(s.time + ': ' + (s.kwh || 0).toFixed(3) + ' kWh') + '"></div>';
        }).join('') + '</div><span class="kmax">' + kLabel + '</span>';
      }

      var lastIdx = slots.length - 1;
      var idxs = twoDays ? [0, 48, 96, 144, lastIdx] : [0, Math.floor(lastIdx * 0.25), Math.floor(lastIdx * 0.5), Math.floor(lastIdx * 0.75), lastIdx];
      var seen = {};
      var labelSpans = idxs.filter(function (idx) {
        if (seen[idx]) return false;
        seen[idx] = true;
        return true;
      }).map(function (idx) {
        var prefix = twoDays && idx === 0 ? T.dayToday + ' ' : (twoDays && idx === 96 ? T.dayTomorrow + ' ' : '');
        return '<span>' + prefix + slots[idx].time + '</span>';
      }).join('');

      return '<div class="chart' + (overlay ? ' tall' : '') + '">' + bars + overlay + refLine + yLabels + '</div>' + kwhRow +
        '<div class="chart-labels">' + labelSpans + '</div>';
    }

    // ----- overview: chart or table -----
    var liveView = 'chart';
    var tableDay = 'today';
    var tableSel = {};
    var lastPrices = null;

    function priceTableHtml() {
      var p = lastPrices;
      if (!p || !p.paired) return '<p class="legend">' + escapeHtml(T.noDevice) + '</p>';
      var days = {};
      p.days.forEach(function (d) { days[d.key] = d; });
      if (tableDay === 'tomorrow' && !days.tomorrow.available) tableDay = 'today';
      var d = days[tableDay];
      var tabs = '<div class="pt-tabs">' +
        '<button class="btn small' + (tableDay === 'today' ? ' active' : '') + '" data-ptday="today">' + escapeHtml(T.dayToday) + ' ' + escapeHtml(days.today.date) + '</button>' +
        '<button class="btn small' + (tableDay === 'tomorrow' ? ' active' : '') + '" data-ptday="tomorrow"' + (days.tomorrow.available ? '' : ' disabled') + '>' + escapeHtml(T.dayTomorrow) + ' ' + escapeHtml(days.tomorrow.date) + '</button></div>';
      if (!d.available) return tabs + '<p class="legend">' + escapeHtml(T.ptPending) + '</p>';
      var blocks = '<div class="pt-blocks">' +
        (d.cheapBlock ? '<span class="c">' + escapeHtml(T.ptCheapLine) + ': <b>' + d.cheapBlock.start + '–' + d.cheapBlock.end + '</b> · Ø ' + d.cheapBlock.avg.toFixed(1) + ' Rp.</span>' : '') +
        (d.cheapFromNow && d.cheapBlock && (d.cheapFromNow.start !== d.cheapBlock.start || d.cheapFromNow.end !== d.cheapBlock.end) ? '<span class="c">' + escapeHtml(T.ptFromNowLine) + ': <b>' + d.cheapFromNow.start + '–' + d.cheapFromNow.end + '</b> · Ø ' + d.cheapFromNow.avg.toFixed(1) + ' Rp.</span>' : '') +
        (d.priciestBlock ? '<span class="p">' + escapeHtml(T.ptPeakLine) + ': <b>' + d.priciestBlock.start + '–' + d.priciestBlock.end + '</b> · Ø ' + d.priciestBlock.avg.toFixed(1) + ' Rp.</span>' : '') + '</div>';
      var now = d.hours.filter(function (h) { return h.isNow; })[0];
      var sel = tableSel[tableDay] !== undefined ? tableSel[tableDay] : (now ? now.hour : null);
      var n = d.hours.length;
      var cells = d.hours.map(function (h) {
        var cls = 'pt-cell' + (h.cheap ? ' cheap' : '') + (h.pricey ? ' pricey' : '') + (h.isNow ? ' now' : '') + (h.isPast ? ' past' : '') + (h.hour === sel ? ' sel' : '');
        return '<div class="' + cls + '" data-pthour="' + h.hour + '"><span class="t">' + h.hour.slice(0, 2) + '</span><span class="p">' + h.avg.toFixed(1) + '</span><span class="pt-dot ' + (h.level || '') + '"></span></div>';
      }).join('');
      var hourSel = d.hours.filter(function (h) { return h.hour === sel; })[0];
      var detail = hourSel
        ? '<div class="pt-detail"><div class="ttl">' + hourSel.hour + ' – ' + String(parseInt(hourSel.hour, 10) + 1).padStart(2, '0') + ':00 · Ø ' + hourSel.avg.toFixed(1) + ' Rp./kWh</div><div class="pt-q">' +
          hourSel.quarters.map(function (q) { return '<div class="q' + (q.isNow ? ' now' : '') + '"><span class="qt">' + q.time + '</span><span class="qp">' + q.value.toFixed(1) + '</span></div>'; }).join('') + '</div></div>'
        : '<div class="pt-detail"><div class="ttl">' + escapeHtml(T.ptTap) + '</div></div>';
      return tabs + blocks + '<div class="pt-grid" style="--r4:' + Math.ceil(n / 4) + ';--r6:' + Math.ceil(n / 6) + '">' + cells + '</div>' + detail + '<p class="legend">' + escapeHtml(T.ptHint) + '</p>';
    }

    function applyLiveView() {
      var chart = $('live-chart'); var table = $('price-table');
      if (!chart || !table) return;
      chart.style.display = liveView === 'chart' ? '' : 'none';
      table.style.display = liveView === 'table' ? '' : 'none';
      Array.prototype.forEach.call(document.querySelectorAll('[data-lv]'), function (b) {
        b.classList.toggle('active', b.getAttribute('data-lv') === liveView);
      });
      if (liveView !== 'table') return;
      table.innerHTML = priceTableHtml();
    }

    function bindLiveView() {
      Array.prototype.forEach.call(document.querySelectorAll('[data-lv]'), function (b) {
        b.addEventListener('click', function () { liveView = b.getAttribute('data-lv'); applyLiveView(); });
      });
      $('price-table').addEventListener('click', function (e) {
        var day = e.target.closest ? e.target.closest('[data-ptday]') : null;
        if (day) { if (!day.disabled) { tableDay = day.getAttribute('data-ptday'); $('price-table').innerHTML = ''; applyLiveView(); } return; }
        var cell = e.target.closest ? e.target.closest('.pt-cell') : null;
        if (cell) { var hr = cell.getAttribute('data-pthour'); tableSel[tableDay] = tableSel[tableDay] === hr ? null : hr; applyLiveView(); }
      });
      applyLiveView();
    }

    function render(data) {
      var root = $('live-root');

      if (!data.paired) {
        root.innerHTML = '<div class="no-device">' + escapeHtml(T.noDevice) + '</div>';
        return;
      }

      var levelClass = LEVEL_CLASS[data.level] || 'normal';
      var levelLabel = data.level ? (T.levels[data.level] || data.level) : '–';
      if (typeof data.total === 'number' && data.total < 0) levelLabel = T.negativePrice;

      root.innerHTML = '' +
        '<div class="top">' +
          '<div>' +
            '<span class="price">' + fmt(data.total) + '</span><span class="unit">Rp./kWh — ' + escapeHtml(data.name) + '</span>' +
          '</div>' +
          '<span class="level" style="color: var(--st-' + levelClass + ')">' + escapeHtml(levelLabel) + '</span>' +
        '</div>' +
        '<div class="stats">' +
          '<div class="chip"><div class="num">' + fmt(data.energy) + '</div><div class="lbl">' + escapeHtml(T.chips.energy) + '</div></div>' +
          '<div class="chip"><div class="num">' + fmt(data.grid) + '</div><div class="lbl">' + escapeHtml(T.chips.grid) + '</div></div>' +
          '<div class="chip"><div class="num">' + fmt(data.next) + '</div><div class="lbl">' + escapeHtml(T.chips.next) + '</div></div>' +
          '<div class="chip"><div class="num">' + (data.rank != null ? data.rank : '–') + '</div><div class="lbl">' + escapeHtml(T.chips.rank) + '</div></div>' +
          '<div class="chip"><div class="num">' + fmt(data.min) + '</div><div class="lbl">' + escapeHtml(T.chips.min) + '</div></div>' +
          '<div class="chip"><div class="num">' + fmt(data.avg) + '</div><div class="lbl">' + escapeHtml(T.chips.avg) + '</div></div>' +
          '<div class="chip"><div class="num">' + fmt(data.max) + '</div><div class="lbl">' + escapeHtml(T.chips.max) + '</div></div>' +
        '</div>' +
        '<div class="pt-tabs"><button class="btn small" data-lv="chart">' + escapeHtml(T.viewChart) + '</button><button class="btn small" data-lv="table">' + escapeHtml(T.viewTable) + '</button></div>' +
        '<div id="live-chart">' + chartHtml(data.slots, false) + '</div><div id="price-table"></div>' +
        (data.noTomorrow ? '<div class="warn">⚠ ' + escapeHtml(T.noTomorrow) + '</div>' : '') +
        (data.lastUpdate ? '<div class="last-update">' + escapeHtml(T.lastUpdate) + ' ' + escapeHtml(data.lastUpdate) + '</div>' : '');
      bindLiveView();
    }

    function agoText(ms) {
      if (!ms) return T.never;
      var min = Math.max(0, Math.round((Date.now() - ms) / 60000));
      if (min < 120) return (DE ? T.ago + ' ' : '') + min + ' ' + T.min;
      var h = Math.round(min / 60);
      if (h < 48) return (DE ? T.ago + ' ' : '') + h + ' ' + T.hours;
      return (DE ? T.ago + ' ' : '') + Math.round(h / 24) + ' ' + T.days;
    }

    function kwhText(v) { return v < 10 ? v.toFixed(2) : v.toFixed(1); }

    function summaryRow(label, s) {
      return '<tr><td>' + escapeHtml(label) + '</td>' +
        '<td>' + kwhText(s.importKwh) + '</td>' +
        '<td>' + kwhText(s.exportKwh) + '</td>' +
        '<td>' + chf(s.netCostDyn) + '</td>' +
        '<td>' + (s.configured ? chf(s.netCostRef) : '–') + '</td>' +
        diffCell(s.savings) + '</tr>';
    }

    // ----- cost curves (plain SVG) -----
    var costView = 'day';
    var costDay = 0;
    var costDayCache = {};
    var MIN_DAYS_30 = 7;
    var apiFn = null; // set by onHomeyReady
    var appVat = 8.1;

    // Live preview of the hourly JSON format (same rules as lib/HourlyOutput.js).
    function hourlyExample() {
      var unit = $('hourly-unit').value; var vat = $('hourly-vat').value;
      var raw = $('hourly-decimals').value;
      var dec = raw === '' ? (unit === 'rp' ? 2 : 4) : Math.max(0, Math.min(6, Math.round(Number(raw)) || 0));
      var f = Math.pow(10, dec);
      var sample = [0.1832, 0.1751, 0.1698];
      var vals = sample.map(function (chf) {
        var v = chf;
        if (vat === 'incl') v *= 1 + appVat / 100;
        if (unit === 'rp') v *= 100;
        return Math.round(v * f) / f;
      });
      $('p-hourly-example').textContent = T.hourlyExample + ': [' + vals.join(', ') + ', …]';
    }
    var themeMode = 'auto';

    function applyTheme(mode) {
      themeMode = mode === 'light' || mode === 'dark' ? mode : 'auto';
      [document.documentElement, document.body].forEach(function (el) {
        if (themeMode === 'auto') el.removeAttribute('data-theme'); else el.setAttribute('data-theme', themeMode);
      });
      var sw = document.getElementById('theme-sw');
      if (!sw) return;
      sw.innerHTML = [['auto', T.themeAuto], ['light', T.themeLight], ['dark', T.themeDark]].map(function (b) {
        return '<button class="btn small' + (themeMode === b[0] ? ' active' : '') + '" data-theme-mode="' + b[0] + '">' + escapeHtml(b[1]) + '</button>';
      }).join('');
    }
    var lastCost = null;

    function niceNum(v, dec) { return (Math.round(v * Math.pow(10, dec == null ? 2 : dec)) / Math.pow(10, dec == null ? 2 : dec)).toFixed(dec == null ? 2 : dec); }

    // series: [{ pts: [number|null...], color, dash }]; x labels are given separately.
    function lineSvg(series, count, xLabels, opts) {
      var o = opts || {};
      var all = [];
      series.forEach(function (s) { s.pts.forEach(function (v) { if (v != null) all.push(v); }); });
      if (!all.length) return '';
      var min = Math.min.apply(null, all.concat([0]));
      var max = Math.max.apply(null, all.concat([0]));
      // A minimum visible range keeps fractions of a cent from looking like big swings.
      if (o.minSpan && max - min < o.minSpan) max = min + o.minSpan;
      var span = max - min || 1;
      var y = function (v) { return 100 - ((v - min) / span) * 100; };
      var lines = series.map(function (s) {
        var p = [];
        s.pts.forEach(function (v, i) { if (v != null) p.push((i + 0.5) + ',' + y(v).toFixed(2)); });
        return p.length > 1 ? '<polyline points="' + p.join(' ') + '" fill="none" stroke="' + s.color + '" stroke-width="2" vector-effect="non-scaling-stroke"' + (s.dash ? ' stroke-dasharray="4 3"' : '') + '/>' : '';
      }).join('');
      var zero = '<line x1="0" x2="' + count + '" y1="' + y(0).toFixed(2) + '" y2="' + y(0).toFixed(2) + '" stroke="var(--st-border)" stroke-width="1" vector-effect="non-scaling-stroke"/>';
      return '<div class="svgchart"><svg viewBox="0 0 ' + count + ' 100" preserveAspectRatio="none">' + zero + lines + '</svg>' +
        '<div class="ylabels"><span>' + niceNum(max, o.dec) + (o.unit ? ' ' + o.unit : '') + '</span><span>' + niceNum(min, o.dec) + (o.unit ? ' ' + o.unit : '') + '</span></div></div>' +
        '<div class="chart-labels">' + xLabels.map(function (l) { return '<span>' + escapeHtml(l) + '</span>'; }).join('') + '</div>';
    }

    function barSvg(values, labels) {
      if (!values.length) return '';
      var min = Math.min.apply(null, values.concat([0]));
      var max = Math.max.apply(null, values.concat([0]));
      var span = max - min || 1;
      var y = function (v) { return 100 - ((v - min) / span) * 100; };
      var zeroY = y(0);
      var bars = values.map(function (v, i) {
        var top = Math.min(y(v), zeroY);
        var h = Math.max(Math.abs(y(v) - zeroY), 0.8);
        return '<rect x="' + (i + 0.12) + '" y="' + top.toFixed(2) + '" width="0.76" height="' + h.toFixed(2) + '" fill="' + (v >= 0 ? 'var(--st-cheap)' : 'var(--st-expensive)') + '"><title>' + escapeHtml(labels[i] + ': ' + niceNum(v)) + '</title></rect>';
      }).join('');
      return '<div class="svgchart"><svg viewBox="0 0 ' + values.length + ' 100" preserveAspectRatio="none"><line x1="0" x2="' + values.length + '" y1="' + zeroY.toFixed(2) + '" y2="' + zeroY.toFixed(2) + '" stroke="var(--st-border)" stroke-width="1" vector-effect="non-scaling-stroke"/>' + bars + '</svg>' +
        '<div class="ylabels"><span>' + niceNum(max) + '</span><span>' + niceNum(min) + '</span></div></div>' +
        '<div class="chart-labels"><span>' + escapeHtml(labels[0]) + '</span><span>' + escapeHtml(labels[labels.length - 1]) + '</span></div>';
    }

    function dayCurveHtml(slots) {
      if (!slots || slots.length < 2) return '<div class="empty-note">' + escapeHtml(T.noDayData) + '</div>';
      var last = -1;
      slots.forEach(function (s, i) { if (s.isNow || s.isPast) last = i; });
      var dyn = []; var ref = [];
      var cd = 0; var cr = 0; var hasRef = false; var anyKwh = false;
      slots.forEach(function (s, i) {
        if (i > last) { dyn.push(null); ref.push(null); return; }
        var imp = s.kwh || 0; var exp = s.exp || 0;
        if (imp || exp) anyKwh = true;
        if (typeof s.price === 'number') cd += imp * s.price - exp * (s.feedIn || 0);
        if (typeof s.ref === 'number') { hasRef = true; cr += imp * s.ref - exp * (s.refFeedIn || 0); }
        dyn.push(cd);
        ref.push(typeof s.ref === 'number' ? cr : null);
      });
      // Values are in Rp.; switch to CHF once they reach a franc.
      var big = Math.max(Math.abs(cd), Math.abs(cr)) >= 100;
      var factor = big ? 0.01 : 1;
      var scale = function (arr) { return arr.map(function (v) { return v == null ? null : v * factor; }); };
      var money = function (rp) { return big ? 'CHF ' + niceNum(rp / 100, 2) : niceNum(rp, 1) + ' Rp.'; };
      var series = [{ pts: scale(dyn), color: 'var(--st-accent)' }];
      if (hasRef) series.push({ pts: scale(ref), color: 'var(--st-muted)', dash: true });
      var idxs = [0, Math.floor((slots.length - 1) * 0.25), Math.floor((slots.length - 1) * 0.5), Math.floor((slots.length - 1) * 0.75), slots.length - 1];
      var labels = idxs.map(function (i) { return slots[i].time; });
      var summary = '<span class="swatch" style="background:var(--st-accent)"></span>' + escapeHtml(T.cumDyn) + ' ' + money(cd) +
        (hasRef ? ' &nbsp; <span class="swatch" style="background:var(--st-muted)"></span>' + escapeHtml(T.cumRef) + ' ' + money(cr) +
          ' &nbsp; ' + escapeHtml(T.cumDiff) + ' <span class="' + (cr - cd >= 0 ? 'good' : 'bad') + '">' + (cr - cd >= 0 ? '+' : '') + money(cr - cd) + '</span>' : '');
      return '<h2 style="margin-top:14px">' + escapeHtml(T.cumHeading) + '</h2>' +
        (anyKwh ? '' : '<p class="legend">' + escapeHtml(T.noData) + '</p>') +
        lineSvg(series, slots.length, labels, big ? { minSpan: 0.02, dec: 2, unit: 'CHF' } : { minSpan: 2, dec: 1, unit: 'Rp.' }) + '<p class="legend">' + summary + '</p><p class="legend">' + escapeHtml(T.cumNote) + '</p>' +
        '<h2 style="margin-top:18px">' + escapeHtml(T.chartHeading) + '</h2>' + chartHtml(slots, true);
    }

    function thirtyDayHtml(days) {
      var list = (days || []).filter(function (d) { return typeof d.savings === 'number'; });
      if (!list.length) return '<div class="empty-note">' + escapeHtml(T.noDayData) + '</div>';
      var vals = list.map(function (d) { return d.savings / 100; });
      var labels = list.map(function (d) { return d.key.slice(5); });
      var cum = []; var c = 0;
      vals.forEach(function (v) { c += v; cum.push(c); });
      return '<h2 style="margin-top:14px">' + escapeHtml(T.savingsHeading) + '</h2>' + barSvg(vals, labels) +
        '<h2 style="margin-top:18px">' + escapeHtml(T.savingsCumHeading) + '</h2>' +
        lineSvg([{ pts: cum, color: 'var(--st-accent)' }], cum.length, [labels[0], labels[labels.length - 1]], { minSpan: 0.02, dec: 2, unit: 'CHF' }) +
        '<p class="legend">' + escapeHtml(T.costsFootnote) + '</p>';
    }

    function dayLabel(offset) {
      var d = new Date();
      d.setDate(d.getDate() - offset);
      var date = d.getDate() + '.' + (d.getMonth() + 1) + '.';
      if (offset === 0) return T.viewToday + ' ' + date;
      if (offset === 1) return T.viewYesterday + ' ' + date;
      return d.toLocaleDateString(DE ? 'de-CH' : 'en-GB', { weekday: 'short' }) + ' ' + date;
    }

    function costDaySlots(offset) {
      if (offset === 0) return lastCost.chart;
      if (offset === 1) return lastCost.chartYesterday;
      return costDayCache[offset] || null;
    }

    function fetchCostDay(offset) {
      if (costDayCache[offset]) return;
      if (!apiFn) return;
      apiFn('GET', '/cost/chart/' + offset).then(function (r) {
        costDayCache[offset] = r.slots || [];
      }).catch(function (e) {
        console.error(e);
        costDayCache[offset] = [];
      }).then(function () {
        if (costView === 'day' && costDay === offset) renderCurves();
      });
    }

    function renderCurves() {
      var root = $('cost-curves');
      if (!root || !lastCost) return;
      var daysWithData = (lastCost.days || []).filter(function (d) { return typeof d.savings === 'number'; }).length;
      var can30 = daysWithData >= MIN_DAYS_30;
      if (costView === '30' && !can30) costView = 'day';
      var nav = '<button class="btn small" data-step="1" aria-label="' + escapeHtml(T.dayPrev) + '"' + (costDay >= 13 ? ' disabled' : '') + '>◀</button>' +
        '<button class="btn small' + (costView === 'day' ? ' active' : '') + '" data-view="day">' + escapeHtml(dayLabel(costDay)) + '</button>' +
        '<button class="btn small" data-step="-1" aria-label="' + escapeHtml(T.dayNext) + '"' + (costDay <= 0 ? ' disabled' : '') + '>▶</button>' +
        '<button class="btn small' + (costView === '30' ? ' active' : '') + '" data-view="30"' + (can30 ? '' : ' disabled') + '>' + escapeHtml(T.view30) + '</button>';
      var body;
      if (costView === '30') {
        body = thirtyDayHtml(lastCost.days);
      } else {
        var slots = costDaySlots(costDay);
        if (slots === null) { fetchCostDay(costDay); body = '<p class="legend">' + escapeHtml(T.loading) + '</p>'; }
        else body = dayCurveHtml(slots);
      }
      root.innerHTML = '<div class="viewsw">' + nav + '</div>' +
        (can30 ? '' : '<p class="legend" style="margin-top:-6px">' + escapeHtml(T.view30Need + daysWithData + T.view30Days) + '</p>') + body;
      Array.prototype.forEach.call(root.querySelectorAll('[data-step]'), function (b) {
        b.addEventListener('click', function () {
          var next = costDay + Number(b.getAttribute('data-step'));
          if (next < 0 || next > 13) return;
          costDay = next; costView = 'day'; renderCurves();
        });
      });
      Array.prototype.forEach.call(root.querySelectorAll('[data-view]'), function (b) {
        b.addEventListener('click', function () { if (!b.disabled) { costView = b.getAttribute('data-view'); renderCurves(); } });
      });
    }

    var batFilled = false;

    function renderShadow(data) {
      var root = $('shadow-root');
      if (!data.paired) { root.innerHTML = '<div class="no-device">' + escapeHtml(T.noDevice) + '</div>'; return; }
      if (!batFilled) {
        batFilled = true;
        $('bat-cap').value = data.params.capacityKwh;
        $('bat-pow').value = data.params.powerKw;
        $('bat-eff').value = Math.round(data.params.roundTrip * 100);
        $('bat-min').value = data.params.minSocPct;
        $('bat-max').value = data.params.maxSocPct;
      }
      var days = data.days || [];
      if (!days.length) { root.innerHTML = '<p class="legend">' + escapeHtml(T.shadowNone) + '</p>'; return; }
      var C = T.shadowCols;
      var row = function (label, d) {
        return '<tr><td>' + escapeHtml(label) + '</td><td>' + chf(d.actual) + '</td><td>' + chf(d.pvOnly) + '</td><td>' + chf(d.withGrid) + '</td><td class="' + (d.gridChargeValue > 0.5 ? 'good' : '') + '">' + chf(d.gridChargeValue) + '</td></tr>';
      };
      var body = days.slice().reverse().map(function (d) { return row(d.key.slice(8) + '.' + d.key.slice(5, 7) + '.', d); }).join('');
      var t = data.total;
      root.innerHTML = '<div class="scroll"><table><thead><tr><th>' + C.day + '</th><th>' + C.actual + '</th><th>' + C.pv + '</th><th>' + C.grid + '</th><th>' + C.val + '</th></tr></thead><tbody>' +
        row(T.shadowSum, t) + body + '</tbody></table></div>' +
        '<p class="legend">' + escapeHtml(T.shadowUnused) + ' <b>CHF ' + chf(t.unused) + '</b> &nbsp; ' + escapeHtml(T.shadowValue) + ' <b>CHF ' + chf(t.gridChargeValue) + '</b></p>' +
        '<p class="legend">' + escapeHtml(T.shadowNote) + '</p>';
    }

    function renderCost(data) {
      lastCost = data;
      var root = $('cost-root');
      if (!data.paired) {
        root.innerHTML = '<div class="no-device">' + escapeHtml(T.noDevice) + '</div>';
        return;
      }

      var C2 = T.colsShort;
      var head = '<tr><th>' + C2.period + '</th><th>' + C2.import + '</th><th>' + C2.export + '</th><th>' + C2.dyn + '</th><th>' + C2.ref + '</th><th>' + C2.diff + '</th></tr>';
      var rows = ['today', 'week', 'month', 'total'].map(function (k) { return summaryRow(T.periods[k], data[k]); }).join('');

      var total = data.month;
      var notes = '';
      if (!(data.total && data.total.importKwh > 0)) notes += '<p class="legend">' + escapeHtml(T.noData) + '</p>';
      if (!(data.total && data.total.configured)) notes += '<p class="legend">' + escapeHtml(T.noRefNote) + '</p>';
      if (total.avgImportPriceDyn != null) {
        notes += '<p class="legend">' + escapeHtml(T.avgPrices) + ' ' + total.avgImportPriceDyn.toFixed(1) + ' / ' +
          (total.avgImportPriceRef != null ? total.avgImportPriceRef.toFixed(1) : '–') + '</p>';
      }
      if (data.total && data.total.batteryBenefit != null) {
        notes += '<p class="legend">' + escapeHtml(T.batteryBenefit) + ': CHF ' + chf(data.total.batteryBenefit, true) + '</p>';
      }
      if (data.total && data.total.unpricedImportKwh > 0.001) {
        notes += '<p class="legend">⚠ ' + escapeHtml(T.unpriced) + ' ' + data.total.unpricedImportKwh.toFixed(2) + ' kWh</p>';
      }

      var tot = data.total || {};
      if (tot.configured && Math.abs(tot.fixedCostDiff || 0) >= 0.5) {
        notes += '<p class="legend">' + escapeHtml(T.fixedNote) + ' ' + chf(tot.fixedCostDiff, true) + '</p>';
      }
      if ((tot.negativeImportKwh || 0) > 0.001) notes += '<p class="legend">' + escapeHtml(T.negImpNote) + ' ' + tot.negativeImportKwh.toFixed(2) + '</p>';
      if ((tot.negativeExportKwh || 0) > 0.001) notes += '<p class="legend">⚠ ' + escapeHtml(T.negExpNote) + ' ' + tot.negativeExportKwh.toFixed(2) + '</p>';

      var consumers = (data.consumers || []).filter(function (c) { return c.kwh > 0; });
      var consHtml = '';
      if (consumers.length) {
        var C = T.consCols;
        consHtml = '<h2 style="margin-top:18px">' + escapeHtml(T.consumersHeading) + '</h2><div class="scroll"><table><thead><tr><th>' + C.name + '</th><th>' + C.kwh + '</th><th>' + C.avg + '</th><th>' + C.day + '</th><th>' + C.adv + '</th><th>' + C.ref + '</th></tr></thead><tbody>' +
          consumers.map(function (c) {
            var adv = c.advantage == null ? '–' : (c.advantage > 0 ? '+' : '') + c.advantage.toFixed(1);
            var advCls = c.advantage == null || Math.abs(c.advantage) < 0.05 ? '' : (c.advantage > 0 ? 'good' : 'bad');
            return '<tr><td>' + escapeHtml(c.name) + '</td><td>' + c.kwh.toFixed(1) + '</td><td>' + (c.avgPrice == null ? '–' : c.avgPrice.toFixed(1)) + '</td><td>' + (c.avgDayPrice == null ? '–' : c.avgDayPrice.toFixed(1)) + '</td><td class="' + advCls + '">' + adv + '</td>' + diffCell(c.savingsVsRef) + '</tr>';
          }).join('') + '</tbody></table></div><p class="legend">' + escapeHtml(T.consNote) + '</p>';
      }

      var days = (data.days || []).slice().reverse();
      var dayRows = days.map(function (d) { return summaryRow(d.key.slice(8) + '.' + d.key.slice(5, 7) + '.', d); }).join('');

      root.innerHTML =
        '<div class="scroll"><table><thead>' + head + '</thead><tbody>' + rows + '</tbody></table></div><p class="legend">' + escapeHtml(T.tableNote) + '</p>' + notes +
        consHtml +
        '<div id="cost-curves"></div>' +
        (days.length ? '<h2 style="margin-top:18px">' + escapeHtml(T.dailyHeading) + '</h2><div class="scroll"><table><thead>' + head + '</thead><tbody>' + dayRows + '</tbody></table></div>' : '') +
        '<p class="legend">' + escapeHtml(T.costsFootnote) + '</p>';
      renderCurves();
    }

    // The periods are loaded once (and after saving) so the periodic refresh never overwrites input.
    var refFormFilled = false;
    var setupAutoClosed = false;
    var refPeriods = [];

    function newPeriod(from) {
      return { from: from || '', price: 0, ntPrice: 0, ntFrom: '', ntTo: '', ntWeekend: false, feedIn: 0, fixedDiff: 0, importLines: [], exportLines: [], linesExclVat: true, _calc: null };
    }

    function vatFactor() {
      var v = Number($('vat-input').value);
      return 1 + (isFinite(v) && v > 0 ? v : 0) / 100;
    }

    function calcSumRp(p, which) {
      var lines = which === 'export' ? p.exportLines : p.importLines;
      var sum = 0;
      lines.forEach(function (l) { sum += Number(l.value) || 0; });
      var factor = which === 'import' && p.linesExclVat ? vatFactor() : 1;
      return Math.round(sum * 100 * factor * 100) / 100;
    }

    function calcHtml(p, i, which) {
      var lines = which === 'export' ? p.exportLines : p.importLines;
      var rows = lines.map(function (l, li) {
        return '<div class="calc-row">' +
          '<input type="text" data-i="' + i + '" data-line="' + li + '" data-lf="name" data-which="' + which + '" value="' + escapeHtml(l.name) + '" placeholder="' + escapeHtml(T.calcNamePh) + '" />' +
          '<input type="number" step="0.0001" min="0" data-i="' + i + '" data-line="' + li + '" data-lf="value" data-which="' + which + '" value="' + (l.value || '') + '" placeholder="' + escapeHtml(T.calcValue) + '" />' +
          '<button class="btn small" data-act="del-line" data-i="' + i + '" data-line="' + li + '" data-which="' + which + '">×</button></div>';
      }).join('');
      var vatRow = which === 'import'
        ? '<label><input type="checkbox" data-i="' + i + '" data-f="linesExclVat"' + (p.linesExclVat ? ' checked' : '') + ' /> ' + escapeHtml(T.calcExcl) + '</label>'
        : '<span class="legend">' + escapeHtml(T.calcExclExport) + '</span>';
      return '<div class="calc">' + rows +
        '<button class="btn small" data-act="add-line" data-i="' + i + '" data-which="' + which + '">' + escapeHtml(T.calcAddLine) + '</button>' +
        '<div class="legend" style="margin-top:8px">' + vatRow + '</div>' +
        '<div class="calc-sum">' + escapeHtml(T.calcSum) + ': <span id="calc-sum-' + which + '-' + i + '">' + calcSumRp(p, which).toFixed(2) + '</span> Rp./kWh</div>' +
        '<button class="btn small primary" data-act="apply-calc" data-i="' + i + '" data-which="' + which + '">' + escapeHtml(T.calcApply) + '</button></div>';
    }

    function renderRefPeriods() {
      var root = $('ref-periods');
      if (!refPeriods.length) {
        root.innerHTML = '<p class="legend">' + escapeHtml(T.refNone) + '</p>';
        return;
      }
      root.innerHTML = refPeriods.map(function (p, i) {
        var L = T.refLabels;
        return '<div class="period"><div class="form">' +
          '<label>' + escapeHtml(L.from) + '</label><input type="date" data-i="' + i + '" data-f="from" value="' + escapeHtml(p.from) + '" />' +
          '<label>' + escapeHtml(L.price) + '</label><div class="inline"><input type="number" min="0" step="0.1" data-i="' + i + '" data-f="price" value="' + (p.price || 0) + '" />' +
            '<button class="btn small" data-act="toggle-calc" data-i="' + i + '" data-which="import">' + escapeHtml(T.calc) + '</button></div>' +
          '</div>' + (p._calc === 'import' ? calcHtml(p, i, 'import') : '') +
          '<div class="form" style="margin-top:10px">' +
          '<label>' + escapeHtml(L.feedIn) + '</label><div class="inline"><input type="number" min="0" step="0.1" data-i="' + i + '" data-f="feedIn" value="' + (p.feedIn || 0) + '" />' +
            '<button class="btn small" data-act="toggle-calc" data-i="' + i + '" data-which="export">' + escapeHtml(T.calc) + '</button></div>' +
          '</div>' + (p._calc === 'export' ? calcHtml(p, i, 'export') : '') +
          '<div class="form" style="margin-top:10px"><label>' + escapeHtml(L.fixedDiff) + '</label>' +
            '<input type="number" step="0.01" data-i="' + i + '" data-f="fixedDiff" value="' + (p.fixedDiff || 0) + '" /></div>' +
          '<p class="legend">' + escapeHtml(T.fixedDiffHint) + '</p>' +
          '<details><summary>' + escapeHtml(L.ntSummary) + '</summary><div class="form" style="margin-top:10px">' +
          '<label>' + escapeHtml(L.ntPrice) + '</label><input type="number" min="0" step="0.1" data-i="' + i + '" data-f="ntPrice" value="' + (p.ntPrice || 0) + '" />' +
          '<label>' + escapeHtml(L.ntFrom) + '</label><input type="text" placeholder="21:00" data-i="' + i + '" data-f="ntFrom" value="' + escapeHtml(p.ntFrom) + '" />' +
          '<label>' + escapeHtml(L.ntTo) + '</label><input type="text" placeholder="07:00" data-i="' + i + '" data-f="ntTo" value="' + escapeHtml(p.ntTo) + '" />' +
          '<label>' + escapeHtml(L.ntWeekend) + '</label><input type="checkbox" data-i="' + i + '" data-f="ntWeekend"' + (p.ntWeekend ? ' checked' : '') + ' />' +
          '</div></details>' +
          '<div class="row"><button class="btn small danger" data-act="remove-period" data-i="' + i + '">' + escapeHtml(T.refRemove) + '</button></div></div>';
      }).join('');
    }

    function renderRef(data) {
      if (!data.paired) return;
      if (!refFormFilled) {
        refFormFilled = true;
        refPeriods = (data.refPeriods || []).map(function (p) {
          var c = JSON.parse(JSON.stringify(p));
          c._calc = null;
          c.importLines = c.importLines || [];
          c.exportLines = c.exportLines || [];
          return c;
        });
        renderRefPeriods();
      }
      var names = (data.consumersTotal || []).map(function (c) { return c.name; });
      var sel = $('del-consumer');
      var keep = sel.value;
      sel.innerHTML = names.length
        ? names.map(function (n) { return '<option value="' + escapeHtml(n) + '">' + escapeHtml(n) + '</option>'; }).join('')
        : '<option value="">' + escapeHtml(T.delConsumerNone) + '</option>';
      if (names.indexOf(keep) >= 0) sel.value = keep;
      var reports = data.reports || {};
      var refDone = Boolean(data.total && data.total.configured);
      var reportedAny = Object.keys(reports).some(function (k) { return reports[k]; });
      var dataDone = Boolean(data.total && (data.total.importKwh > 0 || data.total.exportKwh > 0));
      var done = [refDone, reportedAny, dataDone];
      var allDone = done.every(Boolean);
      $('h2-setup').textContent = allDone ? T.setupDone : T.setupHeading;
      if (allDone && !setupAutoClosed) {
        setupAutoClosed = true;
        $('h2-setup').parentNode.parentNode.open = false;
      }
      $('ol-setup').innerHTML = T.setupSteps.map(function (st, i) {
        return '<li class="' + (done[i] ? 'done' : '') + '"><span class="mark">' + (done[i] ? '✓' : (i + 1)) + '</span><span><div class="t">' +
          escapeHtml(st.t) + '</div><div class="d">' + escapeHtml(st.d) + '</div></span></li>';
      }).join('');
      $('tb-reports').innerHTML = ['import', 'export', 'battery_charge', 'battery_discharge'].map(function (k) {
        return '<tr><td>' + escapeHtml(T.reports[k]) + '</td><td>' + escapeHtml(agoText(reports[k])) + '</td></tr>';
      }).join('');
    }

    function onRefInput(e) {
      var t = e.target;
      var i = t.getAttribute('data-i');
      if (i === null) return;
      var p = refPeriods[Number(i)];
      if (!p) return;
      var f = t.getAttribute('data-f');
      var lf = t.getAttribute('data-lf');
      if (f) {
        var v = t.type === 'checkbox' ? t.checked : t.value;
        if (['price', 'feedIn', 'ntPrice', 'fixedDiff'].indexOf(f) >= 0) v = Number(v) || 0;
        p[f] = v;
        if (f === 'linesExclVat') renderRefPeriods();
      } else if (lf) {
        var which = t.getAttribute('data-which');
        var line = (which === 'export' ? p.exportLines : p.importLines)[Number(t.getAttribute('data-line'))];
        if (!line) return;
        line[lf] = lf === 'value' ? (Number(t.value) || 0) : t.value;
        var out = $('calc-sum-' + which + '-' + i);
        if (out) out.textContent = calcSumRp(p, which).toFixed(2);
      }
    }

    function onRefClick(e) {
      var t = e.target.closest ? e.target.closest('[data-act]') : null;
      if (!t) return;
      var act = t.getAttribute('data-act');
      var i = Number(t.getAttribute('data-i'));
      var p = refPeriods[i];
      var which = t.getAttribute('data-which');
      if (act === 'remove-period') refPeriods.splice(i, 1);
      else if (!p) return;
      else if (act === 'toggle-calc') p._calc = p._calc === which ? null : which;
      else if (act === 'add-line') (which === 'export' ? p.exportLines : p.importLines).push({ name: '', value: 0 });
      else if (act === 'del-line') (which === 'export' ? p.exportLines : p.importLines).splice(Number(t.getAttribute('data-line')), 1);
      else if (act === 'apply-calc') {
        p[which === 'export' ? 'feedIn' : 'price'] = calcSumRp(p, which);
        p._calc = null;
      }
      renderRefPeriods();
    }

    function onHomeyReady(Homey) {
      function apiCall(method, path, body) {
        return new Promise(function (resolve, reject) {
          Homey.api(method, path, body || null, function (err, result) {
            if (err) return reject(err);
            resolve(result);
          });
        });
      }

      apiFn = apiCall;

      // Appearance is stored in the app settings so it survives reopening and follows the user.
      Homey.get('ui_theme', function (err, value) { if (!err) applyTheme(value); });
      $('theme-sw').addEventListener('click', function (e) {
        var b = e.target.closest ? e.target.closest('[data-theme-mode]') : null;
        if (!b) return;
        applyTheme(b.getAttribute('data-theme-mode'));
        Homey.set('ui_theme', themeMode, function (err) { if (err) console.error(err); });
      });

      var vatFilled = false;

      function loadSummary() {
        return apiCall('GET', '/summary').then(render);
      }

      function loadCost() {
        return apiCall('GET', '/cost').then(function (data) {
          renderCost(data);
          renderRef(data);
        });
      }

      function loadConfig() {
        return apiCall('GET', '/config').then(function (cfg) {
          if (!vatFilled) {
            vatFilled = true;
            $('vat-input').value = cfg.vatPercent == null ? 8.1 : cfg.vatPercent;
            $('feedin-mode').value = cfg.feedInMode === 'api' ? 'api' : 'reference';
            appVat = cfg.vatPercent == null ? 8.1 : cfg.vatPercent;
            $('monitor-hours').value = cfg.monitorHours == null ? 1 : cfg.monitorHours;
            $('monitor-notify').checked = cfg.monitorNotify !== false;
            monitorCfg = { kinds: cfg.monitorKinds || {}, consumers: cfg.monitorConsumers || [] };
            monitorListFilled = false; renderMonitorList();
            var ho = cfg.hourlyOutput || {};
            $('hourly-unit').value = ho.unit === 'chf' ? 'chf' : 'rp';
            $('hourly-vat').value = ho.vat === 'excl' ? 'excl' : 'incl';
            $('hourly-decimals').value = ho.decimals == null ? '' : ho.decimals;
            hourlyExample();
          }
        });
      }

      function loadPrices() {
        return apiCall('GET', '/prices').then(function (p) { lastPrices = p; applyLiveView(); });
      }

      function loadShadow() {
        return apiCall('GET', '/cost/shadow').then(renderShadow);
      }

      function ageText(min) {
        if (min === null || min === undefined) return T.stNever;
        if (min < 60) return min + ' min';
        if (min < 48 * 60) return Math.floor(min / 60) + ' h ' + (min % 60 ? (min % 60) + ' min' : '');
        return Math.floor(min / 1440) + ' d';
      }

      function clockText(ms) {
        var d = new Date(ms); var now = new Date();
        var t = d.toLocaleTimeString(DE ? 'de-CH' : 'en-GB', { hour: '2-digit', minute: '2-digit' });
        var dayMs = 86400000;
        var diff = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / dayMs);
        return (diff === 0 ? T.stTodayWord : diff === 1 ? T.stTomorrowWord : d.getDate() + '.' + (d.getMonth() + 1) + '.') + ' ' + t;
      }

      function renderStatus(st) {
        var banner = $('status-banner'); var card = $('status-card');
        if (!st || !st.paired) { card.hidden = true; banner.hidden = true; return; }
        card.hidden = false;
        var msgs = [];
        (st.prices.issues || []).forEach(function (c) { msgs.push(T['stIssue_' + c] || c); });
        var rep = st.reports;
        if (rep && (rep.level === 'warn' || rep.level === 'alarm')) {
          msgs.push(T.stReportsLate + ': ' + rep.kinds.filter(function (k) { return k.level === 'warn' || k.level === 'alarm'; }).map(function (k) { return T['stKind_' + k.kind] + ' (' + ageText(k.ageMin) + ')'; }).join(', '));
        }
        $('status-dot').className = 'st-dot ' + (st.level === 'alarm' ? 'alarm' : st.level === 'warn' ? 'warn' : 'ok');
        $('status-summary').textContent = msgs.length ? msgs[0] : T.stOk;
        banner.hidden = msgs.length === 0;
        banner.className = 'warn' + (st.level === 'alarm' ? '' : ' amber');
        banner.textContent = '';
        msgs.forEach(function (m, i) { banner.appendChild(document.createTextNode((i ? ' · ' : '') + m)); });

        var p = st.prices;
        var lvlCls = function (l) { return l === 'alarm' ? 'alarmTxt' : l === 'warn' ? 'warnTxt' : ''; };
        var priceLines = [
          T.stLastOk + ': ' + (p.lastOk ? T.stAgo + ' ' + ageText(p.lastOkAgeMin) : T.stNever),
          T.stNext + ': ' + (p.nextPlanned ? clockText(p.nextPlanned) : '–'),
          T.stData + ': ' + T.stToday + ' ' + p.todaySlots + '/' + p.todayExpected + ', ' + T.stTomorrow + ' ' + p.tomorrowSlots + '/' + p.tomorrowExpected,
        ];
        if (p.failures) priceLines.push(T.stFailures + ': ' + p.failures);
        if (p.lastError) priceLines.push(T.stLastError + ': ' + p.lastError.code + ' – ' + p.lastError.message + ' (' + T.stAgo + ' ' + ageText(Math.round((Date.now() - p.lastError.at) / 60000)) + ')');
        var issueHtml = (p.issues || []).map(function (c) { return '<div class="' + lvlCls(p.level) + '">' + escapeHtml(T['stIssue_' + c] || c) + '</div>'; }).join('');

        var repHtml;
        if (!rep.monitored) {
          repHtml = escapeHtml(T.stNoReports);
        } else {
          repHtml = rep.kinds.filter(function (k) { return k.last !== null; }).map(function (k) {
            return '<div class="' + (k.enabled ? lvlCls(k.level) : 'legend') + '">' + escapeHtml(T['stKind_' + k.kind]) + ': ' + escapeHtml(T.stAgo) + ' ' + escapeHtml(ageText(k.ageMin)) + '</div>';
          }).join('') + (rep.consumers || []).map(function (c) {
            return '<div class="' + (c.monitored ? lvlCls(c.level) : 'legend') + '">' + escapeHtml(c.name) + ': ' + escapeHtml(T.stAgo) + ' ' + escapeHtml(ageText(c.ageMin)) + '</div>';
          }).join('') + '<div class="legend">' + escapeHtml(rep.thresholdHours > 0 ? T.stMonitorOn + ' ' + rep.thresholdHours + ' ' + T.stHours : T.stMonitorOff) + '</div>';
        }
        $('status-body').innerHTML = '<table class="stat"><tbody>' +
          '<tr><td>' + escapeHtml(T.stPrices) + '</td><td>' + priceLines.map(escapeHtml).join('<br>') + issueHtml + '</td></tr>' +
          '<tr><td>' + escapeHtml(T.stConn) + '</td><td>' + escapeHtml(T.stEnv) + ': ' + escapeHtml(st.environment === 'test' ? T.stEnvTest : T.stEnvProd) + '<br>' + escapeHtml(T.stPriceField) + ': ' + escapeHtml(st.priceField) + '</td></tr>' +
          '<tr><td>' + escapeHtml(T.stReports) + '</td><td>' + repHtml + '</td></tr>' +
          '<tr><td>' + escapeHtml(T.stDevice) + '</td><td>' + escapeHtml(T.stMetering) + ': ' + escapeHtml(st.metering || '–') + '<br>' + escapeHtml(T.stVersion) + ': ' + escapeHtml(st.appVersion || '–') +
          (st.backup ? '<br>' + escapeHtml(T.stBackup) + ': ' + escapeHtml(fmtStamp(st.backup.createdAt)) + ' (' + st.backup.days + ' ' + escapeHtml(T.backupDaysWord) + ')' : '') + '</td></tr>' +
          '</tbody></table>';
      }

      var monitorListFilled = false;
      var lastReportsInfo = null;
      var monitorCfg = { kinds: {}, consumers: [] };

      function renderMonitorList() {
        var box = $('monitor-list');
        if (!lastReportsInfo || monitorListFilled) return;
        monitorListFilled = true;
        var html = lastReportsInfo.kinds.map(function (k) {
          var on = monitorCfg.kinds[k.kind] !== false;
          return '<label class="bk-check"><input type="checkbox" data-mk="' + k.kind + '"' + (on && k.last !== null ? ' checked' : '') + (k.last === null ? ' disabled' : '') + ' /> <span>' + escapeHtml(T['stKind_' + k.kind]) + (k.last === null ? ' (' + escapeHtml(T.monitorNeverReported) + ')' : '') + '</span></label>';
        }).join('');
        if ((lastReportsInfo.consumers || []).length) {
          html += '<p class="legend">' + escapeHtml(T.monitorConsumersNote) + '</p>' + lastReportsInfo.consumers.map(function (c) {
            return '<label class="bk-check"><input type="checkbox" data-mc="' + escapeHtml(c.name) + '"' + (monitorCfg.consumers.indexOf(c.name) >= 0 ? ' checked' : '') + ' /> <span>' + escapeHtml(c.name) + '</span></label>';
          }).join('');
        }
        box.innerHTML = html;
      }

      function loadStatus() {
        return apiCall('GET', '/status').then(function (st) {
          renderStatus(st);
          if (st && st.paired) { lastReportsInfo = st.reports; renderMonitorList(); }
        });
      }

      function fmtStamp(ms) {
        return new Date(ms).toLocaleString(DE ? 'de-CH' : 'en-GB', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
      }

      function renderBackup(st) {
        var notice = $('backup-notice');
        if (!st || !st.paired) { notice.hidden = true; $('p-backup-status').textContent = ''; return; }
        var it = st.items && st.items[0];
        $('p-backup-status').textContent = it
          ? T.backupLast + ': ' + fmtStamp(it.createdAt) + ' · ' + it.days + ' ' + T.backupDaysWord + ', ' + it.consumers + ' ' + T.backupConsumersWord
          : T.backupNone;
        notice.hidden = !st.restorable;
        if (st.restorable && it) {
          $('p-backup-found').textContent = T.backupFoundText + ' (' + T.backupFrom + ' ' + fmtStamp(it.createdAt) + ', ' + it.days + ' ' + T.backupDaysWord + ')';
        }
      }

      function loadBackup() {
        return apiCall('GET', '/backup').then(renderBackup);
      }

      function reloadAfterRestore() {
        vatFilled = false; batFilled = false; refFormFilled = false;
        costDayCache = {};
        return loadAll();
      }

      function renderBackupPreview(sm) {
        var box = $('backup-preview');
        var p = sm.preview;
        if (!p || !p.rows || !p.rows.length) { box.hidden = true; box.innerHTML = ''; return; }
        var chfv = function (rp) { return (rp / 100).toFixed(2); };
        var rows = p.rows.slice(0, 10).map(function (r) {
          return '<tr><td>' + r.key.slice(8) + '.' + r.key.slice(5, 7) + '.</td><td>' + r.importKwh.toFixed(2) + '</td><td>' + chfv(r.netCostDyn) + '</td></tr>';
        }).join('');
        var more = (p.rows.length - 10) + p.hiddenRows;
        var cons = (p.consumerTotals || []).map(function (c) { return escapeHtml(c.name) + ' ' + c.kwh.toFixed(1) + ' kWh'; }).join(', ');
        var cmp = sm.compare
          ? '<p class="legend">' + escapeHtml(T.previewCompareMerge) + ' <b>' + sm.compare.newDays + '</b> ' + escapeHtml(T.previewNewDays) + ' (' + sm.compare.sharedDays + ' ' + escapeHtml(T.previewSharedDays) + '). ' +
            escapeHtml(T.previewCompareReplace) + ' <b>' + sm.compare.onlyOnDevice + '</b> ' + escapeHtml(T.previewDaysOnlyOnDevice) + '.</p>'
          : '';
        box.innerHTML = '<div class="scroll"><table><thead><tr><th>' + escapeHtml(T.previewDay) + '</th><th>' + escapeHtml(T.previewImport) + '</th><th>' + escapeHtml(T.previewNet) + '</th></tr></thead><tbody>' + rows +
          '<tr><td><b>' + escapeHtml(T.previewTotal) + '</b></td><td><b>' + p.total.importKwh.toFixed(2) + '</b></td><td><b>' + chfv(p.total.netCostDyn) + '</b></td></tr></tbody></table></div>' +
          (more > 0 ? '<p class="legend">+ ' + more + ' ' + escapeHtml(T.previewMore) + '</p>' : '') +
          '<p class="legend">' + escapeHtml(T.previewBattery) + ': ' + p.total.batteryChargeKwh.toFixed(1) + ' / ' + p.total.batteryDischargeKwh.toFixed(1) + (cons ? ' · ' + cons : '') + '</p>' + cmp;
        box.hidden = false;
      }

      function backupMessage(text, isError) {
        var el = $(isError ? 'manage-err' : 'manage-msg');
        $('manage-msg').hidden = true; $('manage-err').hidden = true;
        el.textContent = text; el.hidden = false;
        setTimeout(function () { el.hidden = true; }, 4000);
      }

      function loadAll() {
        return Promise.all([
          loadStatus().catch(function (err) { console.error(err); }),
          loadBackup().catch(function (err) { console.error(err); }),
          loadShadow().catch(function (err) { console.error(err); }),
          loadPrices().catch(function (err) { console.error(err); }),
          loadSummary().catch(function (err) {
            console.error(err);
            $('live-root').innerHTML = '<div class="load-error">' + escapeHtml(T.loadFailed) + '</div>';
          }),
          loadCost().catch(function (err) {
            console.error(err);
            $('cost-root').innerHTML = '<div class="load-error">' + escapeHtml(T.loadFailed) + '</div>';
          }),
          loadConfig().catch(function (err) { console.error(err); }),
        ]);
      }

      Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (btn) {
        btn.addEventListener('click', function () {
          Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) { b.classList.remove('active'); });
          Array.prototype.forEach.call(document.querySelectorAll('.panel'), function (p) { p.classList.remove('active'); });
          btn.classList.add('active');
          $('panel-' + btn.getAttribute('data-tab')).classList.add('active');
        });
      });

      $('btn-forum').addEventListener('click', function () {
        Homey.openURL('https://community.homey.app/t/app-pro-swiss-dynamic-electricity-tariff-15-minute-prices-for-innostrom-swisspower-tariffs/160031');
      });

      $('btn-bat-save').addEventListener('click', function () {
        var ok = $('bat-saved'); var err = $('bat-error');
        ok.hidden = true; err.hidden = true;
        var body = { battery: { capacityKwh: Number($('bat-cap').value), powerKw: Number($('bat-pow').value), roundTrip: Number($('bat-eff').value) / 100, minSocPct: Number($('bat-min').value), maxSocPct: Number($('bat-max').value) } };
        apiCall('PUT', '/config', body).then(function () {
          ok.textContent = T.savedMsg; ok.hidden = false;
          setTimeout(function () { ok.hidden = true; }, 2500);
          return loadShadow();
        }).catch(function (e) {
          err.textContent = T.saveFailed + ((e && e.message) || e); err.hidden = false;
        });
      });

      ['hourly-unit', 'hourly-vat', 'hourly-decimals'].forEach(function (id) {
        $(id).addEventListener('input', hourlyExample);
        $(id).addEventListener('change', hourlyExample);
      });
      $('btn-hourly-save').addEventListener('click', function () {
        var ok = $('hourly-saved'); var err = $('hourly-error');
        ok.hidden = true; err.hidden = true;
        var raw = $('hourly-decimals').value;
        var dec = raw === '' ? null : Number(raw);
        if (dec !== null && (!isFinite(dec) || dec % 1 !== 0 || dec < 0 || dec > 6)) {
          err.textContent = T.hourlyInvalid; err.hidden = false;
          return;
        }
        apiCall('PUT', '/config', { hourlyOutput: { unit: $('hourly-unit').value, vat: $('hourly-vat').value, decimals: dec } }).then(function () {
          ok.textContent = T.savedMsg; ok.hidden = false;
          setTimeout(function () { ok.hidden = true; }, 2500);
        }).catch(function (e) {
          err.textContent = T.saveFailed + ((e && e.message) || e); err.hidden = false;
        });
      });

      $('btn-monitor-save').addEventListener('click', function () {
        var ok = $('monitor-saved'); var err = $('monitor-error');
        ok.hidden = true; err.hidden = true;
        var raw = $('monitor-hours').value;
        var h = Number(raw);
        if (raw === '' || !isFinite(h) || h < 0 || h > 48) { err.textContent = T.monitorInvalid; err.hidden = false; return; }
        var kinds = {}; var consumers = [];
        Array.prototype.forEach.call(document.querySelectorAll('#monitor-list [data-mk]'), function (el) { if (!el.disabled) kinds[el.getAttribute('data-mk')] = el.checked; });
        Array.prototype.forEach.call(document.querySelectorAll('#monitor-list [data-mc]'), function (el) { if (el.checked) consumers.push(el.getAttribute('data-mc')); });
        apiCall('PUT', '/config', { monitorHours: h, monitorNotify: $('monitor-notify').checked, monitorKinds: kinds, monitorConsumers: consumers }).then(function () {
          ok.textContent = T.savedMsg; ok.hidden = false;
          setTimeout(function () { ok.hidden = true; }, 2500);
          monitorCfg = { kinds: Object.assign({}, monitorCfg.kinds, kinds), consumers: consumers };
          monitorListFilled = false;
          return loadStatus();
        }).catch(function (e) { err.textContent = T.saveFailed + ((e && e.message) || e); err.hidden = false; });
      });
      $('btn-backup-save').addEventListener('click', function () {
        apiCall('POST', '/backup/save').then(function (r) {
          backupMessage(r && r.saved ? T.backupSaved : T.backupNone, false);
          return loadBackup();
        }).catch(function (e) { backupMessage(T.saveFailed + ((e && e.message) || e), true); });
      });
      $('btn-backup-export').addEventListener('click', function () {
        apiCall('POST', '/backup/export').then(function (r) {
          $('backup-export-text').value = r.text;
          $('backup-export-box').hidden = false;
        }).catch(function (e) { backupMessage(T.saveFailed + ((e && e.message) || e), true); });
      });
      $('btn-backup-copy').addEventListener('click', function () {
        var ta = $('backup-export-text');
        var done = function () { backupMessage(T.backupCopied, false); };
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(ta.value).then(done, function () { ta.select(); document.execCommand('copy'); done(); }); return; }
        } catch (e) { /* fall through */ }
        ta.select();
        try { document.execCommand('copy'); done(); } catch (e2) { /* the text stays selected for manual copy */ }
      });
      $('btn-backup-check').addEventListener('click', function () {
        var out = $('p-backup-check');
        $('backup-restore-row').hidden = true; $('backup-preview').hidden = true;
        apiCall('POST', '/backup/inspect', { text: $('backup-import-text').value }).then(function (sm) {
          out.textContent = T.backupCheckOk + ': ' + sm.days + ' ' + T.backupDaysWord + (sm.firstDay ? ' (' + sm.firstDay + ' – ' + sm.lastDay + ')' : '') +
            (sm.consumers && sm.consumers.length ? ', ' + sm.consumers.join(', ') : '') + (sm.createdAt ? ' · ' + T.backupFrom + ' ' + fmtStamp(sm.createdAt) : '');
          out.hidden = false;
          renderBackupPreview(sm);
          $('backup-restore-row').hidden = false;
        }).catch(function () {
          out.textContent = T.backupInvalid; out.hidden = false; $('backup-preview').hidden = true;
        });
      });
      function restoreFromText(mode) {
        return apiCall('POST', '/backup/restore', { source: 'text', text: $('backup-import-text').value, mode: mode, includeSettings: $('backup-with-settings').checked }).then(function () {
          backupMessage(T.backupRestored, false);
          $('backup-import-text').value = ''; $('backup-restore-row').hidden = true; $('p-backup-check').hidden = true; $('backup-preview').hidden = true;
          return reloadAfterRestore();
        }).catch(function (e) { backupMessage(T.saveFailed + ((e && e.message) || e), true); });
      }
      $('btn-backup-merge').addEventListener('click', function () { restoreFromText('merge'); });
      (function () {
        var armedRep = false; var btn = $('btn-backup-replace');
        btn.addEventListener('click', function () {
          if (!armedRep) {
            armedRep = true; btn.textContent = T.confirm;
            setTimeout(function () { armedRep = false; btn.textContent = T.backupReplace; }, 4000);
            return;
          }
          armedRep = false; btn.textContent = T.backupReplace;
          restoreFromText('replace');
        });
      }());
      $('btn-backup-restore-app').addEventListener('click', function () {
        var err = $('backup-notice-err'); err.hidden = true;
        apiCall('POST', '/backup/restore', { source: 'app', index: 0, mode: 'replace', includeSettings: false }).then(function () {
          backupMessage(T.backupRestored, false);
          return reloadAfterRestore();
        }).catch(function (e) { err.textContent = T.saveFailed + ((e && e.message) || e); err.hidden = false; });
      });

      $('btn-vat-save').addEventListener('click', function () {
        var ok = $('vat-saved');
        var err = $('vat-error');
        ok.hidden = true;
        err.hidden = true;
        var v = Number($('vat-input').value);
        if (!isFinite(v) || v < 0 || v > 100 || $('vat-input').value === '') {
          err.textContent = T.vatInvalid;
          err.hidden = false;
          return;
        }
        apiCall('PUT', '/config', { vatPercent: v, feedInMode: $('feedin-mode').value }).then(function () {
          ok.textContent = T.savedMsg;
          ok.hidden = false;
          setTimeout(function () { ok.hidden = true; }, 2500);
          return loadSummary();
        }).catch(function (e) {
          err.textContent = T.saveFailed + ((e && e.message) || e);
          err.hidden = false;
        });
      });

      $('ref-periods').addEventListener('input', onRefInput);
      $('ref-periods').addEventListener('change', onRefInput);
      $('ref-periods').addEventListener('click', onRefClick);
      $('btn-ref-add').addEventListener('click', function () {
        var last = refPeriods.length ? refPeriods[refPeriods.length - 1] : null;
        var p = newPeriod('');
        if (last) {
          p.price = last.price; p.feedIn = last.feedIn; p.fixedDiff = last.fixedDiff || 0;
          p.ntPrice = last.ntPrice; p.ntFrom = last.ntFrom; p.ntTo = last.ntTo; p.ntWeekend = last.ntWeekend;
          p.importLines = JSON.parse(JSON.stringify(last.importLines || []));
          p.exportLines = JSON.parse(JSON.stringify(last.exportLines || []));
          p.linesExclVat = last.linesExclVat;
        }
        refPeriods.push(p);
        renderRefPeriods();
      });

      $('btn-ref-save').addEventListener('click', function () {
        var ok = $('ref-saved');
        var err = $('ref-error');
        ok.hidden = true;
        err.hidden = true;
        var timeOk = /^([01]?\d|2[0-3]):[0-5]\d$/;
        var bad = refPeriods.some(function (p) {
          return (p.ntFrom && !timeOk.test(p.ntFrom)) || (p.ntTo && !timeOk.test(p.ntTo));
        });
        if (bad) {
          err.textContent = T.invalidTime;
          err.hidden = false;
          return;
        }
        var body = { periods: refPeriods.map(function (p) {
          var c = JSON.parse(JSON.stringify(p));
          delete c._calc;
          return c;
        }) };
        apiCall('PUT', '/cost/config', body).then(function () {
          ok.textContent = T.savedMsg;
          ok.hidden = false;
          setTimeout(function () { ok.hidden = true; }, 2500);
          refFormFilled = false;
          costDayCache = {};
          return loadCost();
        }).catch(function (e) {
          err.textContent = T.saveFailed + ((e && e.message) || e);
          err.hidden = false;
        });
      });

      // Every delete action needs a second click within 4 seconds.
      function armed(btnId, label, action) {
        var btn = $(btnId);
        var armedNow = false;
        btn.addEventListener('click', function () {
          if (!armedNow) {
            armedNow = true;
            btn.textContent = T.confirm;
            setTimeout(function () { armedNow = false; btn.textContent = label(); }, 4000);
            return;
          }
          armedNow = false;
          btn.textContent = label();
          var msg = $('manage-msg');
          var err = $('manage-err');
          msg.hidden = true;
          err.hidden = true;
          action().then(function (res) {
            var text = T.manageDone;
            if (res && typeof res.days === 'number') text += ' — ' + T.manageDays + ' ' + res.days;
            msg.textContent = text;
            msg.hidden = false;
            setTimeout(function () { msg.hidden = true; }, 4000);
            costDayCache = {};
            return loadCost();
          }).catch(function (e) {
            err.textContent = T.saveFailed + ((e && e.message) || e);
            err.hidden = false;
          });
        });
      }

      armed('btn-del-days', function () { return T.delDays; }, function () {
        return apiCall('POST', '/cost/delete', { from: $('del-from').value, to: $('del-to').value });
      });
      armed('btn-del-consumer', function () { return T.delConsumer; }, function () {
        return apiCall('POST', '/cost/delete', { consumer: $('del-consumer').value });
      });
      armed('btn-baselines', function () { return T.baselineButton; }, function () {
        return apiCall('POST', '/cost/delete', { baselines: true });
      });
      armed('btn-reset', function () { return T.resetButton; }, function () {
        return apiCall('POST', '/cost/reset');
      });

      // Homey.ready() is called only after the first load settles (success or failure).
      loadAll().then(function () {
        Homey.ready();
        setInterval(function () {
          loadAll().catch(function (e) { console.error(e); });
        }, 60000);
      });
    }
    window.onHomeyReady = onHomeyReady;
  </script>
</body>
</html>
