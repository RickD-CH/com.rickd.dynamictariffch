<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title id="doc-title">Dynamischer Stromtarif CH</title>
  <style>
    :root {
      color-scheme: light dark;
      --st-text: #1a1a1a;
      --st-muted: #767676;
      --st-border: #e0e0e0;
      --st-bg: #ffffff;
      --st-card-bg: #f7f7f8;
      --st-chip-bg: #f2f2f2;
      --st-cheap: #2e7d32;
      --st-normal: #767676;
      --st-expensive: #d32f2f;
      --st-accent: #0277bd;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --st-text: #f2f2f2;
        --st-muted: #a0a0a0;
        --st-border: #3a3a3c;
        --st-bg: #131314;
        --st-card-bg: #1e1e20;
        --st-chip-bg: #2a2a2c;
        --st-cheap: #66bb6a;
        --st-normal: #a0a0a0;
        --st-expensive: #ef5350;
        --st-accent: #4fc3f7;
      }
    }
    .homey-dark-mode {
      --st-text: #f2f2f2;
      --st-muted: #a0a0a0;
      --st-border: #3a3a3c;
      --st-bg: #131314;
      --st-card-bg: #1e1e20;
      --st-chip-bg: #2a2a2c;
      --st-cheap: #66bb6a;
      --st-normal: #a0a0a0;
      --st-expensive: #ef5350;
      --st-accent: #4fc3f7;
    }
    * { box-sizing: border-box; }
    html, body { height: auto; min-height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px; color: var(--st-text); background: var(--st-bg);
      padding: 16px 20px 32px;
    }
    h2 { font-size: 15px; margin: 0 0 10px; }
    p { line-height: 1.5; }
    .sub { color: var(--st-muted); margin: 0 0 20px; }
    #p-sub { margin-top: 0; }
    .tabs { display: flex; gap: 2px; overflow-x: auto; margin: 0 0 16px; border-bottom: 1px solid var(--st-border); }
    .tab {
      flex: 0 0 auto; background: transparent; border: 0; border-bottom: 2px solid transparent;
      color: var(--st-muted); font-size: 14px; font-weight: 600; padding: 8px 12px; cursor: pointer; white-space: nowrap;
    }
    .tab.active { color: var(--st-accent); border-bottom-color: var(--st-accent); }
    .panel { display: none; }
    .panel.active { display: block; }
    .card {
      border: 1px solid var(--st-border); border-radius: 10px; padding: 16px 18px;
      margin-bottom: 16px; background: var(--st-card-bg);
    }
    ul { margin: 8px 0; padding-left: 20px; }
    li { margin-bottom: 4px; line-height: 1.4; }
    ol { margin: 8px 0; padding-left: 22px; }
    .recommend { display: grid; grid-template-columns: minmax(140px, auto) 1fr; gap: 6px 16px; margin-top: 8px; }
    .recommend dt { font-weight: 600; }
    .recommend dd { margin: 0; color: var(--st-muted); }
    .top { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    .price { font-size: 30px; font-weight: 700; }
    .unit { font-size: 13px; color: var(--st-muted); margin-left: 4px; }
    .level {
      font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px;
      background: var(--st-chip-bg);
    }
    .stats { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .chip {
      flex: 1; min-width: 80px; display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 8px 4px; border-radius: 8px; background: var(--st-chip-bg);
    }
    .chip .num { font-size: 15px; font-weight: 700; }
    .chip .lbl { font-size: 10px; color: var(--st-muted); text-align: center; }
    .chart {
      position: relative; display: flex; align-items: flex-end; height: 90px; gap: 1px; margin-top: 16px;
      background: var(--st-chip-bg); border-radius: 8px; padding: 6px;
    }
    .chart .refline { position: absolute; left: 6px; top: 6px; width: calc(100% - 12px); height: calc(100% - 12px); pointer-events: none; }
    .kwhrow { display: flex; align-items: flex-end; height: 34px; gap: 1px; margin-top: 6px; padding: 0 6px; }
    .kbar { flex: 1; min-width: 1px; border-radius: 1px; background: var(--st-accent); }
    .bar { flex: 1; min-width: 1px; border-radius: 1px; }
    .bar.past { opacity: .45; }
    .bar.now { outline: 2px solid var(--st-text); outline-offset: -1px; }
    .chart-labels { display: flex; justify-content: space-between; margin-top: 4px; font-size: 10px; color: var(--st-muted); }
    .legend { font-size: 11px; color: var(--st-muted); margin-top: 6px; }
    .warn {
      margin-top: 12px; padding: 8px 10px; border-radius: 8px; background: rgba(211,47,47,.12);
      color: var(--st-expensive); font-size: 12px; text-align: center;
    }
    .last-update { font-size: 11px; color: var(--st-muted); margin-top: 10px; }
    .no-device, .load-error { text-align: center; color: var(--st-muted); padding: 20px 0; }
    .load-error { color: var(--st-expensive); }
    code { background: var(--st-chip-bg); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: right; padding: 6px 6px; border-bottom: 1px solid var(--st-border); white-space: nowrap; }
    th:first-child, td:first-child { text-align: left; }
    th { font-size: 11px; color: var(--st-muted); font-weight: 600; }
    .scroll { overflow-x: auto; }
    .good { color: var(--st-cheap); font-weight: 600; }
    .bad { color: var(--st-expensive); font-weight: 600; }
    .btn {
      border: 1px solid var(--st-border); background: var(--st-chip-bg); color: var(--st-text);
      border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer;
    }
    .btn.primary { background: var(--st-accent); border-color: var(--st-accent); color: #fff; }
    .btn.danger { color: var(--st-expensive); }
    .form { display: grid; grid-template-columns: minmax(150px, 1fr) minmax(90px, 140px); gap: 10px 14px; align-items: center; max-width: 520px; }
    .form label { color: var(--st-text); }
    .form input[type=text], .form input[type=number] {
      width: 100%; padding: 7px 9px; font-size: 14px; border: 1px solid var(--st-border);
      border-radius: 8px; background: var(--st-bg); color: var(--st-text);
    }
    .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    .ok { color: var(--st-cheap); font-size: 13px; }
    .err { color: var(--st-expensive); font-size: 13px; }
    .status td:last-child { text-align: left; }
    .manage-row { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 10px 0; border-top: 1px solid var(--st-border); }
    .manage-row:first-of-type { border-top: 0; }
    .manage-row select { padding: 7px 9px; font-size: 14px; border: 1px solid var(--st-border); border-radius: 8px; background: var(--st-bg); color: var(--st-text); min-width: 140px; }
    .manage-row .form { max-width: 360px; flex: 1; }
    .checklist { list-style: none; padding: 0; margin: 8px 0 0; }
    .checklist li { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 10px; }
    .checklist .mark { flex: 0 0 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--st-muted); text-align: center; line-height: 19px; font-size: 12px; margin-top: 1px; }
    .checklist li.done .mark { background: var(--st-cheap); border-color: var(--st-cheap); color: #fff; }
    .checklist .t { font-weight: 600; }
    .checklist .d { color: var(--st-muted); font-size: 13px; line-height: 1.4; }
    .period { border: 1px solid var(--st-border); border-radius: 10px; padding: 14px; margin-bottom: 12px; background: var(--st-bg); }
    .inline { display: flex; gap: 8px; align-items: center; }
    .inline input { flex: 1; min-width: 0; }
    .calc { margin: 10px 0 4px; padding: 10px; border-radius: 8px; background: var(--st-chip-bg); }
    .calc-row { display: grid; grid-template-columns: 1fr 100px 28px; gap: 6px; margin-bottom: 6px; }
    .calc-row input { width: 100%; padding: 6px 8px; font-size: 13px; border: 1px solid var(--st-border); border-radius: 6px; background: var(--st-bg); color: var(--st-text); }
    .calc-sum { font-weight: 600; margin: 8px 0; }
    details { margin-top: 10px; }
    summary { cursor: pointer; color: var(--st-muted); font-size: 13px; }
    .btn.small { padding: 4px 10px; font-size: 12px; }
  </style>
</head>
<body>
  <p class="sub" id="p-sub"></p>

  <nav class="tabs">
    <button class="tab active" data-tab="overview" id="t-overview"></button>
    <button class="tab" data-tab="costs" id="t-costs"></button>
    <button class="tab" data-tab="reference" id="t-reference"></button>
    <button class="tab" data-tab="help" id="t-help"></button>
  </nav>

  <div class="panel active" id="panel-overview">
    <div class="card">
      <h2 id="h2-general"></h2>
      <div class="form">
        <label for="vat-input" id="l-vat"></label><input type="number" id="vat-input" min="0" max="100" step="0.1" />
      </div>
      <p class="legend" id="p-vat-hint"></p>
      <div class="row">
        <button class="btn primary" id="btn-vat-save"></button>
        <span class="ok" id="vat-saved" hidden></span>
        <span class="err" id="vat-error" hidden></span>
      </div>
    </div>

    <div class="card">
      <h2 id="h2-recommend"></h2>
      <p class="sub" id="p-recommend-sub" style="margin-bottom:0"></p>
      <dl class="recommend" id="dl-recommend"></dl>
    </div>

    <div class="card" id="live-card">
      <h2 id="h2-live"></h2>
      <div id="live-root"><div class="no-device" id="initial-loading"></div></div>
    </div>
  </div>

  <div class="panel" id="panel-costs">
    <div class="card">
      <h2 id="h2-costs"></h2>
      <div id="cost-root"><div class="no-device" id="cost-loading"></div></div>
    </div>
  </div>

  <div class="panel" id="panel-reference">
    <div class="card">
      <h2 id="h2-setup"></h2>
      <p class="sub" id="p-setup-intro" style="margin-bottom:8px"></p>
      <ol class="checklist" id="ol-setup"></ol>
    </div>

    <div class="card">
      <h2 id="h2-ref"></h2>
      <p class="sub" id="p-ref-hint" style="margin-bottom:14px"></p>
      <div id="ref-periods"></div>
      <div class="row">
        <button class="btn" id="btn-ref-add"></button>
        <button class="btn primary" id="btn-ref-save"></button>
        <span class="ok" id="ref-saved" hidden></span>
        <span class="err" id="ref-error" hidden></span>
      </div>
    </div>

    <div class="card">
      <h2 id="h2-meters"></h2>
      <p class="sub" id="p-meters-intro" style="margin-bottom:8px"></p>
      <ol id="ol-meters"></ol>
      <p class="sub" id="p-meters-note"></p>
      <div class="scroll"><table class="status"><tbody id="tb-reports"></tbody></table></div>
    </div>

    <div class="card">
      <h2 id="h2-manage"></h2>
      <p class="sub" id="p-manage-hint" style="margin-bottom:12px"></p>

      <div class="manage-row">
        <div class="form" style="grid-template-columns: 1fr 1fr;">
          <label for="del-from" id="l-del-from"></label><input type="date" id="del-from" />
          <label for="del-to" id="l-del-to"></label><input type="date" id="del-to" />
        </div>
        <button class="btn danger" id="btn-del-days"></button>
      </div>

      <div class="manage-row">
        <select id="del-consumer"></select>
        <button class="btn danger" id="btn-del-consumer"></button>
      </div>

      <div class="manage-row">
        <span class="legend" id="p-baseline-hint"></span>
        <button class="btn" id="btn-baselines"></button>
      </div>

      <div class="manage-row">
        <span class="legend" id="p-reset-hint"></span>
        <button class="btn danger" id="btn-reset"></button>
      </div>
      <p class="ok" id="manage-msg" hidden></p>
      <p class="err" id="manage-err" hidden></p>
    </div>
  </div>

  <div class="panel" id="panel-help">
    <div class="card">
      <h2 id="h2-forum"></h2>
      <p class="sub" id="hint-forum" style="margin-bottom:12px"></p>
      <button class="btn" id="btn-forum"></button>
    </div>

    <div class="card">
      <h2 id="h2-features"></h2>
      <ul id="ul-features"></ul>
    </div>
  </div>

    function escapeHtml(str) {
      return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {

      if (typeof rp !== 'number' || !isFinite(rp)) return '–';

    }

    function diffCell(rp) {
      if (typeof rp !== 'number' || !isFinite(rp)) return '<td>–</td>';

      return '<td class="' + cls + '">' + chf(rp, true) + '</td>';

    function interpolateColor(ratio) {
      var r = ratio < 0 ? 0 : (ratio > 1 ? 1 : ratio);
      var cheap = [46, 125, 50];
      var expensive = [211, 47, 47];
      var rgb = cheap.map(function (c, i) { return Math.round(c + (expensive[i] - c) * r); });
      return 'rgb(' + rgb.join(',') + ')';
    }

    // slots: [{time, value|price, ref, kwh, isNow, isPast}]; withKwh adds the import row.
    function chartHtml(slots, withKwh) {
      if (!slots || slots.length < 2) return '';
      var valueOf = function (s) { return typeof s.value === 'number' ? s.value : s.price; };
      var values = [];
      for (var i = 0; i < slots.length; i += 1) {
        if (typeof valueOf(slots[i]) === 'number') values.push(valueOf(slots[i]));
        if (typeof slots[i].ref === 'number') values.push(slots[i].ref);
      }
      if (!values.length) return '';
      var min = Math.min.apply(null, values);
      var max = Math.max.apply(null, values);
      var span = max - min;
      var pct = function (v) { return span > 0 ? (v - min) / span : 0.5; };

      var bars = slots.map(function (s) {
        var v = valueOf(s);
        var hasValue = typeof v === 'number';
        var ratio = hasValue ? pct(v) : 0;
        var heightPct = hasValue ? Math.max(4, Math.round(ratio * 100)) : 4;
        var color = hasValue ? interpolateColor(ratio) : 'var(--st-border)';
        var classes = 'bar' + (s.isNow ? ' now' : '') + (s.isPast ? ' past' : '');
        var title = s.time + (hasValue ? ': ' + v.toFixed(2) + ' Rp./kWh' : '');
        return '<div class="' + classes + '" style="height:' + heightPct + '%;background:' + color + '" title="' + escapeHtml(title) + '"></div>';
      }).join('');

      var pts = [];
      slots.forEach(function (s, idx) {
        if (typeof s.ref === 'number') pts.push((idx + 0.5) + ',' + (100 - Math.round(pct(s.ref) * 100)));
      });
      var refLine = pts.length > 1
        ? '<svg class="refline" viewBox="0 0 ' + slots.length + ' 100" preserveAspectRatio="none"><polyline points="' + pts.join(' ') + '" fill="none" stroke="var(--st-accent)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-dasharray="4 3"/></svg>'
        : '';

      var kwhRow = '';
      if (withKwh) {
        var maxKwh = 0;
        slots.forEach(function (s) { if (s.kwh > maxKwh) maxKwh = s.kwh; });
        kwhRow = '<div class="kwhrow">' + slots.map(function (s) {
          var h = maxKwh > 0 && s.kwh > 0 ? Math.max(6, Math.round((s.kwh / maxKwh) * 100)) : 0;
          return '<div class="kbar" style="height:' + h + '%" title="' + escapeHtml(s.time + ': ' + (s.kwh || 0).toFixed(3) + ' kWh') + '"></div>';
        }).join('') + '</div>';
      }

      var lastIdx = slots.length - 1;
      var idxs = [0, Math.floor(lastIdx * 0.25), Math.floor(lastIdx * 0.5), Math.floor(lastIdx * 0.75), lastIdx];
      var seen = {};
      var labelSpans = idxs.filter(function (idx) {
        if (seen[idx]) return false;
        seen[idx] = true;
        return true;
      }).map(function (idx) { return '<span>' + slots[idx].time + '</span>'; }).join('');

      return '<div class="chart">' + bars + refLine + '</div>' + kwhRow +
        '<div class="chart-labels">' + labelSpans + '</div>';
    }

      var levelLabel = data.level ? (T.levels[data.level] || data.level) : '–';

      root.innerHTML = '' +
        '<div class="top">' +

      }

      var tot = data.total || {};
      if (tot.configured && Math.abs(tot.fixedCostDiff || 0) >= 0.5) {
        notes += '<p class="legend">' + escapeHtml(T.fixedNote) + ' ' + chf(tot.fixedCostDiff, true) + '</p>';
      }
      if ((tot.negativeImportKwh || 0) > 0.001) notes += '<p class="legend">' + escapeHtml(T.negImpNote) + ' ' + tot.negativeImportKwh.toFixed(2) + '</p>';
      if ((tot.negativeExportKwh || 0) > 0.001) notes += '<p class="legend">⚠ ' + escapeHtml(T.negExpNote) + ' ' + tot.negativeExportKwh.toFixed(2) + '</p>';

      var consumers = (data.consumers || []).filter(function (c) { return c.kwh > 0; });
      var consHtml = '';
      if (consumers.length) {
        var C = T.consCols;
        consHtml = '<h2 style="margin-top:18px">' + escapeHtml(T.consumersHeading) + '</h2><div class="scroll"><table><thead><tr><th>' + C.name + '</th><th>' + C.kwh + '</th><th>' + C.avg + '</th><th>' + C.day + '</th><th>' + C.adv + '</th><th>' + C.ref + '</th></tr></thead><tbody>' +
          consumers.map(function (c) {
            var adv = c.advantage == null ? '–' : (c.advantage > 0 ? '+' : '') + c.advantage.toFixed(1);
            var advCls = c.advantage == null || Math.abs(c.advantage) < 0.05 ? '' : (c.advantage > 0 ? 'good' : 'bad');
            return '<tr><td>' + escapeHtml(c.name) + '</td><td>' + c.kwh.toFixed(1) + '</td><td>' + (c.avgPrice == null ? '–' : c.avgPrice.toFixed(1)) + '</td><td>' + (c.avgDayPrice == null ? '–' : c.avgDayPrice.toFixed(1)) + '</td><td class="' + advCls + '">' + adv + '</td>' + diffCell(c.savingsVsRef) + '</tr>';
          }).join('') + '</tbody></table></div><p class="legend">' + escapeHtml(T.consNote) + '</p>';

    function newPeriod(from) {
      return { from: from || '', price: 0, ntPrice: 0, ntFrom: '', ntTo: '', ntWeekend: false, feedIn: 0, fixedDiff: 0, importLines: [], exportLines: [], linesExclVat: true, _calc: null };
    }

    function vatFactor() {
      var v = Number($('vat-input').value);
      return 1 + (isFinite(v) && v > 0 ? v : 0) / 100;
    }

    function calcSumRp(p, which) {
      var lines = which === 'export' ? p.exportLines : p.importLines;
      var sum = 0;
      lines.forEach(function (l) { sum += Number(l.value) || 0; });
      var factor = which === 'import' && p.linesExclVat ? vatFactor() : 1;
      return Math.round(sum * 100 * factor * 100) / 100;
    }

    function calcHtml(p, i, which) {
      var lines = which === 'export' ? p.exportLines : p.importLines;
      var rows = lines.map(function (l, li) {
        return '<div class="calc-row">' +
          '<input type="text" data-i="' + i + '" data-line="' + li + '" data-lf="name" data-which="' + which + '" value="' + escapeHtml(l.name) + '" placeholder="' + escapeHtml(T.calcNamePh) + '" />' +
          '<input type="number" step="0.0001" min="0" data-i="' + i + '" data-line="' + li + '" data-lf="value" data-which="' + which + '" value="' + (l.value || '') + '" placeholder="' + escapeHtml(T.calcValue) + '" />' +
          '<button class="btn small" data-act="del-line" data-i="' + i + '" data-line="' + li + '" data-which="' + which + '">×</button></div>';
      }).join('');
      var vatRow = which === 'import'
        ? '<label><input type="checkbox" data-i="' + i + '" data-f="linesExclVat"' + (p.linesExclVat ? ' checked' : '') + ' /> ' + escapeHtml(T.calcExcl) + '</label>'
        : '<span class="legend">' + escapeHtml(T.calcExclExport) + '</span>';
      return '<div class="calc">' + rows +
        '<button class="btn small" data-act="add-line" data-i="' + i + '" data-which="' + which + '">' + escapeHtml(T.calcAddLine) + '</button>' +
        '<div class="legend" style="margin-top:8px">' + vatRow + '</div>' +
        '<div class="calc-sum">' + escapeHtml(T.calcSum) + ': <span id="calc-sum-' + which + '-' + i + '">' + calcSumRp(p, which).toFixed(2) + '</span> Rp./kWh</div>' +
        '<button class="btn small primary" data-act="apply-calc" data-i="' + i + '" data-which="' + which + '">' + escapeHtml(T.calcApply) + '</button></div>';
    }

    function renderRefPeriods() {
      var root = $('ref-periods');
      if (!refPeriods.length) {
        root.innerHTML = '<p class="legend">' + escapeHtml(T.refNone) + '</p>';
        return;
      }
      root.innerHTML = refPeriods.map(function (p, i) {
        var L = T.refLabels;
        return '<div class="period"><div class="form">' +
          '<label>' + escapeHtml(L.from) + '</label><input type="date" data-i="' + i + '" data-f="from" value="' + escapeHtml(p.from) + '" />' +
          '<label>' + escapeHtml(L.price) + '</label><div class="inline"><input type="number" min="0" step="0.1" data-i="' + i + '" data-f="price" value="' + (p.price || 0) + '" />' +
            '<button class="btn small" data-act="toggle-calc" data-i="' + i + '" data-which="import">' + escapeHtml(T.calc) + '</button></div>' +
          '</div>' + (p._calc === 'import' ? calcHtml(p, i, 'import') : '') +
          '<div class="form" style="margin-top:10px">' +
          '<label>' + escapeHtml(L.feedIn) + '</label><div class="inline"><input type="number" min="0" step="0.1" data-i="' + i + '" data-f="feedIn" value="' + (p.feedIn || 0) + '" />' +
            '<button class="btn small" data-act="toggle-calc" data-i="' + i + '" data-which="export">' + escapeHtml(T.calc) + '</button></div>' +
          '</div>' + (p._calc === 'export' ? calcHtml(p, i, 'export') : '') +
          '<div class="form" style="margin-top:10px"><label>' + escapeHtml(L.fixedDiff) + '</label>' +
            '<input type="number" step="0.01" data-i="' + i + '" data-f="fixedDiff" value="' + (p.fixedDiff || 0) + '" /></div>' +
          '<p class="legend">' + escapeHtml(T.fixedDiffHint) + '</p>' +
          '<details><summary>' + escapeHtml(L.ntSummary) + '</summary><div class="form" style="margin-top:10px">' +
          '<label>' + escapeHtml(L.ntPrice) + '</label><input type="number" min="0" step="0.1" data-i="' + i + '" data-f="ntPrice" value="' + (p.ntPrice || 0) + '" />' +
          '<label>' + escapeHtml(L.ntFrom) + '</label><input type="text" placeholder="21:00" data-i="' + i + '" data-f="ntFrom" value="' + escapeHtml(p.ntFrom) + '" />' +
          '<label>' + escapeHtml(L.ntTo) + '</label><input type="text" placeholder="07:00" data-i="' + i + '" data-f="ntTo" value="' + escapeHtml(p.ntTo) + '" />' +
          '<label>' + escapeHtml(L.ntWeekend) + '</label><input type="checkbox" data-i="' + i + '" data-f="ntWeekend"' + (p.ntWeekend ? ' checked' : '') + ' />' +
          '</div></details>' +
          '<div class="row"><button class="btn small danger" data-act="remove-period" data-i="' + i + '">' + escapeHtml(T.refRemove) + '</button></div></div>';
      }).join('');
    }

    function renderRef(data) {
      if (!data.paired) return;
      if (!refFormFilled) {
        refFormFilled = true;
        refPeriods = (data.refPeriods || []).map(function (p) {
          var c = JSON.parse(JSON.stringify(p));
          c._calc = null;
          c.importLines = c.importLines || [];
          c.exportLines = c.exportLines || [];
          return c;
        });
        renderRefPeriods();
      }
      var names = (data.consumersTotal || []).map(function (c) { return c.name; });
      var sel = $('del-consumer');
      var keep = sel.value;
      sel.innerHTML = names.length
        ? names.map(function (n) { return '<option value="' + escapeHtml(n) + '">' + escapeHtml(n) + '</option>'; }).join('')
        : '<option value="">' + escapeHtml(T.delConsumerNone) + '</option>';
      if (names.indexOf(keep) >= 0) sel.value = keep;
      var reports = data.reports || {};
      var refDone = Boolean(data.total && data.total.configured);
      var reportedAny = Object.keys(reports).some(function (k) { return reports[k]; });
      var dataDone = Boolean(data.total && (data.total.importKwh > 0 || data.total.exportKwh > 0));
      var done = [refDone, reportedAny, dataDone];
      $('ol-setup').innerHTML = T.setupSteps.map(function (st, i) {
        return '<li class="' + (done[i] ? 'done' : '') + '"><span class="mark">' + (done[i] ? '✓' : (i + 1)) + '</span><span><div class="t">' +
          escapeHtml(st.t) + '</div><div class="d">' + escapeHtml(st.d) + '</div></span></li>';
      }).join('');
      $('tb-reports').innerHTML = ['import', 'export', 'battery_charge', 'battery_discharge'].map(function (k) {
        return '<tr><td>' + escapeHtml(T.reports[k]) + '</td><td>' + escapeHtml(agoText(reports[k])) + '</td></tr>';
      }).join('');
    }

    function onRefInput(e) {
      var t = e.target;
      var i = t.getAttribute('data-i');
      if (i === null) return;
      var p = refPeriods[Number(i)];
      if (!p) return;
      var f = t.getAttribute('data-f');
      var lf = t.getAttribute('data-lf');
      if (f) {
        var v = t.type === 'checkbox' ? t.checked : t.value;
        if (['price', 'feedIn', 'ntPrice', 'fixedDiff'].indexOf(f) >= 0) v = Number(v) || 0;
        p[f] = v;
        if (f === 'linesExclVat') renderRefPeriods();
      } else if (lf) {
        var which = t.getAttribute('data-which');
        var line = (which === 'export' ? p.exportLines : p.importLines)[Number(t.getAttribute('data-line'))];
        if (!line) return;
        line[lf] = lf === 'value' ? (Number(t.value) || 0) : t.value;
        var out = $('calc-sum-' + which + '-' + i);
        if (out) out.textContent = calcSumRp(p, which).toFixed(2);
      }
    }

    function onRefClick(e) {
      var t = e.target.closest ? e.target.closest('[data-act]') : null;
      if (!t) return;
      var act = t.getAttribute('data-act');
      var i = Number(t.getAttribute('data-i'));
      var p = refPeriods[i];
      var which = t.getAttribute('data-which');
      if (act === 'remove-period') refPeriods.splice(i, 1);
      else if (!p) return;
      else if (act === 'toggle-calc') p._calc = p._calc === which ? null : which;
      else if (act === 'add-line') (which === 'export' ? p.exportLines : p.importLines).push({ name: '', value: 0 });
      else if (act === 'del-line') (which === 'export' ? p.exportLines : p.importLines).splice(Number(t.getAttribute('data-line')), 1);
      else if (act === 'apply-calc') {
        p[which === 'export' ? 'feedIn' : 'price'] = calcSumRp(p, which);
        p._calc = null;
      }
      renderRefPeriods();
    }

    function onHomeyReady(Homey) {
      function apiCall(method, path, body) {
        return new Promise(function (resolve, reject) {
          Homey.api(method, path, body || null, function (err, result) {
            if (err) return reject(err);
            resolve(result);
          });
        });
      }

      var vatFilled = false;

      function loadSummary() {
        return apiCall('GET', '/summary').then(render);
      }

      function loadCost() {
        return apiCall('GET', '/cost').then(function (data) {
          renderCost(data);
          renderRef(data);
        });
      }

      function loadConfig() {
        return apiCall('GET', '/config').then(function (cfg) {
          if (!vatFilled) {
            vatFilled = true;
            $('vat-input').value = cfg.vatPercent == null ? 8.1 : cfg.vatPercent;
          }
        });
      }

      function loadAll() {
        return Promise.all([
          loadSummary().catch(function (err) {
            console.error(err);
            $('live-root').innerHTML = '<div class="load-error">' + escapeHtml(T.loadFailed) + '</div>';
          }),
          loadCost().catch(function (err) {
            console.error(err);
            $('cost-root').innerHTML = '<div class="load-error">' + escapeHtml(T.loadFailed) + '</div>';
          }),
          loadConfig().catch(function (err) { console.error(err); }),
        ]);
      }

      Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (btn) {
        btn.addEventListener('click', function () {
          Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) { b.classList.remove('active'); });
          Array.prototype.forEach.call(document.querySelectorAll('.panel'), function (p) { p.classList.remove('active'); });
          btn.classList.add('active');
          $('panel-' + btn.getAttribute('data-tab')).classList.add('active');
        });
      });

      $('btn-forum').addEventListener('click', function () {
        Homey.openURL('https://community.homey.app/t/app-pro-swiss-dynamic-electricity-tariff-15-minute-prices-for-innostrom-swisspower-tariffs/160031');
      });

      $('btn-vat-save').addEventListener('click', function () {
        var ok = $('vat-saved');
        var err = $('vat-error');
        ok.hidden = true;
        err.hidden = true;
        var v = Number($('vat-input').value);
        if (!isFinite(v) || v < 0 || v > 100 || $('vat-input').value === '') {
          err.textContent = T.vatInvalid;
          err.hidden = false;
          return;
        }
        apiCall('PUT', '/config', { vatPercent: v }).then(function () {
          ok.textContent = T.savedMsg;
          ok.hidden = false;
          setTimeout(function () { ok.hidden = true; }, 2500);
          return loadSummary();
        }).catch(function (e) {
          err.textContent = T.saveFailed + ((e && e.message) || e);
          err.hidden = false;
        });
      });

      $('ref-periods').addEventListener('input', onRefInput);
      $('ref-periods').addEventListener('change', onRefInput);
      $('ref-periods').addEventListener('click', onRefClick);
      $('btn-ref-add').addEventListener('click', function () {
        var last = refPeriods.length ? refPeriods[refPeriods.length - 1] : null;
        var p = newPeriod('');
        if (last) {
          p.price = last.price; p.feedIn = last.feedIn; p.fixedDiff = last.fixedDiff || 0;
          p.ntPrice = last.ntPrice; p.ntFrom = last.ntFrom; p.ntTo = last.ntTo; p.ntWeekend = last.ntWeekend;
          p.importLines = JSON.parse(JSON.stringify(last.importLines || []));
          p.exportLines = JSON.parse(JSON.stringify(last.exportLines || []));
          p.linesExclVat = last.linesExclVat;
        }
        refPeriods.push(p);
        renderRefPeriods();
      });

      $('btn-ref-save').addEventListener('click', function () {
        var ok = $('ref-saved');
        var err = $('ref-error');
        ok.hidden = true;
        err.hidden = true;
        var timeOk = /^([01]?\d|2[0-3]):[0-5]\d$/;
        var bad = refPeriods.some(function (p) {
          return (p.ntFrom && !timeOk.test(p.ntFrom)) || (p.ntTo && !timeOk.test(p.ntTo));
        });
        if (bad) {
          err.textContent = T.invalidTime;
          err.hidden = false;
          return;
        }
        var body = { periods: refPeriods.map(function (p) {
          var c = JSON.parse(JSON.stringify(p));
          delete c._calc;
          return c;
        }) };
        apiCall('PUT', '/cost/config', body).then(function () {
          ok.textContent = T.savedMsg;
          ok.hidden = false;
          setTimeout(function () { ok.hidden = true; }, 2500);
          refFormFilled = false;
          return loadCost();
        }).catch(function (e) {
          err.textContent = T.saveFailed + ((e && e.message) || e);
          err.hidden = false;
        });
      });

      // Every delete action needs a second click within 4 seconds.
      function armed(btnId, label, action) {
        var btn = $(btnId);
        var armedNow = false;
        btn.addEventListener('click', function () {
          if (!armedNow) {
            armedNow = true;
            btn.textContent = T.confirm;
            setTimeout(function () { armedNow = false; btn.textContent = label(); }, 4000);
            return;
          }
          armedNow = false;
          btn.textContent = label();
          var msg = $('manage-msg');
          var err = $('manage-err');
          msg.hidden = true;
          err.hidden = true;
          action().then(function (res) {
            var text = T.manageDone;
            if (res && typeof res.days === 'number') text += ' — ' + T.manageDays + ' ' + res.days;
            msg.textContent = text;
            msg.hidden = false;
            setTimeout(function () { msg.hidden = true; }, 4000);
            return loadCost();
          }).catch(function (e) {
            err.textContent = T.saveFailed + ((e && e.message) || e);
            err.hidden = false;
          });
        });
      }

      armed('btn-del-days', function () { return T.delDays; }, function () {
        return apiCall('POST', '/cost/delete', { from: $('del-from').value, to: $('del-to').value });
      });
      armed('btn-del-consumer', function () { return T.delConsumer; }, function () {
        return apiCall('POST', '/cost/delete', { consumer: $('del-consumer').value });
      });
      armed('btn-baselines', function () { return T.baselineButton; }, function () {
        return apiCall('POST', '/cost/delete', { baselines: true });
      });
      armed('btn-reset', function () { return T.resetButton; }, function () {
        return apiCall('POST', '/cost/reset');
      });

      // Homey.ready() is called only after the first load settles (success or failure).
      loadAll().then(function () {
        Homey.ready();
        setInterval(function () {
          loadAll().catch(function (e) { console.error(e); });
        }, 60000);
      });
    }
    window.onHomeyReady = onHomeyReady;
  </script>
</body>
</html>
