<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title id="doc-title">Dynamischer Stromtarif CH</title>
  <style>
    :root {
      color-scheme: light dark;
      --st-text: #1a1a1a;
      --st-muted: #767676;
      --st-border: #e0e0e0;
      --st-bg: #ffffff;
      --st-card-bg: #f7f7f8;
      --st-chip-bg: #f2f2f2;
      --st-cheap: #2e7d32;
      --st-normal: #767676;
      --st-expensive: #d32f2f;
      --st-accent: #0277bd;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --st-text: #f2f2f2;
        --st-muted: #a0a0a0;
        --st-border: #3a3a3c;
        --st-bg: #131314;
        --st-card-bg: #1e1e20;
        --st-chip-bg: #2a2a2c;
        --st-cheap: #66bb6a;
        --st-normal: #a0a0a0;
        --st-expensive: #ef5350;
        --st-accent: #4fc3f7;
      }
    }
    .homey-dark-mode {
      --st-text: #f2f2f2;
      --st-muted: #a0a0a0;
      --st-border: #3a3a3c;
      --st-bg: #131314;
      --st-card-bg: #1e1e20;
      --st-chip-bg: #2a2a2c;
      --st-cheap: #66bb6a;
      --st-normal: #a0a0a0;
      --st-expensive: #ef5350;
      --st-accent: #4fc3f7;
    }
    [data-theme="light"] {
      color-scheme: light;
      --st-text: #1a1a1a;
      --st-muted: #767676;
      --st-border: #e0e0e0;
      --st-bg: #ffffff;
      --st-card-bg: #f7f7f8;
      --st-chip-bg: #f2f2f2;
      --st-cheap: #2e7d32;
      --st-normal: #767676;
      --st-expensive: #d32f2f;
      --st-accent: #0277bd;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --st-text: #f2f2f2;
      --st-muted: #a0a0a0;
      --st-border: #3a3a3c;
      --st-bg: #131314;
      --st-card-bg: #1e1e20;
      --st-chip-bg: #2a2a2c;
      --st-cheap: #66bb6a;
      --st-normal: #a0a0a0;
      --st-expensive: #ef5350;
      --st-accent: #4fc3f7;
    }
    * { box-sizing: border-box; }
    html, body { height: auto; min-height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px; color: var(--st-text); background: var(--st-bg);
      padding: 16px 20px 32px;
    }
    h2 { font-size: 15px; margin: 0 0 10px; }
    p { line-height: 1.5; }
    .sub { color: var(--st-muted); margin: 0 0 20px; }
    #p-sub { margin-top: 0; }
    .tabs { display: flex; gap: 2px; overflow-x: auto; margin: 0 0 16px; border-bottom: 1px solid var(--st-border); }
    .tab {
      flex: 0 0 auto; background: transparent; border: 0; border-bottom: 2px solid transparent;
      color: var(--st-muted); font-size: 14px; font-weight: 600; padding: 8px 12px; cursor: pointer; white-space: nowrap;
    }
    .tab.active { color: var(--st-accent); border-bottom-color: var(--st-accent); }
    .panel { display: none; }
    .panel.active { display: block; }
    .card {
      border: 1px solid var(--st-border); border-radius: 10px; padding: 16px 18px;
      margin-bottom: 16px; background: var(--st-card-bg);
    }
    ul { margin: 8px 0; padding-left: 20px; }
    li { margin-bottom: 4px; line-height: 1.4; }
    ol { margin: 8px 0; padding-left: 22px; }
    .recommend { display: grid; grid-template-columns: minmax(140px, auto) 1fr; gap: 6px 16px; margin-top: 8px; }
    .recommend dt { font-weight: 600; }
    .recommend dd { margin: 0; color: var(--st-muted); }
    .top { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    .price { font-size: 30px; font-weight: 700; }
    .unit { font-size: 13px; color: var(--st-muted); margin-left: 4px; }
    .level {
      font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px;
      background: var(--st-chip-bg);
    }
    .stats { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .chip {
      flex: 1; min-width: 80px; display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 8px 4px; border-radius: 8px; background: var(--st-chip-bg);
    }
    .chip .num { font-size: 15px; font-weight: 700; }
    .chip .lbl { font-size: 10px; color: var(--st-muted); text-align: center; }
    .chart {
      position: relative; display: flex; align-items: flex-end; height: 90px; gap: 1px; margin-top: 16px;
      background: var(--st-chip-bg); border-radius: 8px; padding: 6px;
    }
    .chart .refline { position: absolute; left: 6px; top: 6px; width: calc(100% - 12px); height: calc(100% - 12px); pointer-events: none; }
    .chart .ylabels span, .chart .reflabel { background: var(--st-chip-bg); padding: 0 3px; border-radius: 3px; opacity: .88; }
    .chart .reflabel { position: absolute; right: 8px; transform: translateY(-110%); font-size: 10px; color: var(--st-accent); pointer-events: none; }
    .pt-tabs { display: flex; gap: 6px; margin: 4px 0 8px; }
    .pt-blocks { font-size: 11px; color: var(--st-muted); display: flex; flex-direction: column; gap: 2px; margin-bottom: 6px; }
    .pt-blocks .c b { color: var(--st-cheap); }
    .pt-blocks .p b { color: var(--st-expensive); }
    .pt-grid { display: grid; grid-auto-flow: column; gap: 4px; margin-top: 6px; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(var(--r4), 30px); }
    @media (min-width: 560px) { .pt-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); grid-template-rows: repeat(var(--r6), 30px); } }
    .pt-cell { display: flex; align-items: center; gap: 4px; padding: 0 6px; height: 30px; border-radius: 7px; background: var(--st-chip-bg); border-left: 3px solid transparent; cursor: pointer; min-width: 0; }
    .pt-cell .t { color: var(--st-muted); font-size: 10.5px; font-variant-numeric: tabular-nums; flex: 0 0 auto; }
    .pt-cell .p { font-weight: 700; font-size: 12px; font-variant-numeric: tabular-nums; flex: 1 1 auto; text-align: right; }
    .pt-cell.cheap { border-left-color: var(--st-cheap); }
    .pt-cell.pricey { border-left-color: var(--st-expensive); }
    .pt-cell.past { opacity: .5; }
    .pt-cell.now { outline: 2px solid var(--st-accent); outline-offset: -2px; }
    .pt-cell.sel { background: var(--st-border); }
    .pt-detail { margin-top: 8px; padding: 6px 8px; border-radius: 8px; background: var(--st-chip-bg); min-height: 44px; }
    .pt-detail .ttl { font-size: 10.5px; color: var(--st-muted); margin-bottom: 4px; }
    .pt-q { display: flex; gap: 6px; }
    .pt-q .q { flex: 1; text-align: center; padding: 3px 0; border-radius: 6px; background: var(--st-card-bg); }
    .pt-q .q .qt { display: block; font-size: 10px; color: var(--st-muted); }
    .pt-q .q .qp { font-weight: 700; font-size: 12px; font-variant-numeric: tabular-nums; }
    .pt-q .q.now { outline: 2px solid var(--st-accent); outline-offset: -2px; }
    .pt-dot { width: 10px; height: 10px; border-radius: 50%; background: #9e9e9e; }
    .pt-dot.very_cheap { background: #2e7d32; }
    .pt-dot.cheap { background: #66bb6a; }
    .pt-dot.expensive { background: #fb8c00; }
    .pt-dot.very_expensive { background: #d32f2f; }
    .kwhlabel { font-size: 10px; color: var(--st-muted); margin-top: 8px; padding: 0 6px; }
    .swb { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--st-accent); margin-right: 5px; vertical-align: -1px; }
    .chart.tall { height: 130px; }
    .kover { position: absolute; left: 6px; top: 6px; width: calc(100% - 12px); height: calc(100% - 12px); display: flex; align-items: flex-end; gap: 1px; pointer-events: none; }
    .kover .kbar { opacity: .7; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
    .kover .kbar.daybreak { margin-left: 3px; }
    .chart .kmax { position: absolute; right: 8px; top: 6px; font-size: 10px; color: var(--st-accent); background: var(--st-chip-bg); padding: 0 3px; border-radius: 3px; opacity: .88; font-weight: 600; }
    .kbar { flex: 1; min-width: 1px; border-radius: 1px; background: var(--st-accent); }
    .bar { flex: 1; min-width: 1px; border-radius: 1px; }
    .bar.past { opacity: .45; }
    .bar.daybreak { margin-left: 3px; }
    .bar.now { outline: 2px solid var(--st-text); outline-offset: -1px; }
    .chart-labels { display: flex; justify-content: space-between; margin-top: 4px; font-size: 10px; color: var(--st-muted); }
    .legend { font-size: 11px; color: var(--st-muted); margin-top: 6px; }
    .warn {
      margin-top: 12px; padding: 8px 10px; border-radius: 8px; background: rgba(211,47,47,.12);
      color: var(--st-expensive); font-size: 12px; text-align: center;
    }
    .last-update { font-size: 11px; color: var(--st-muted); margin-top: 10px; }
    .no-device, .load-error { text-align: center; color: var(--st-muted); padding: 20px 0; }
    .load-error { color: var(--st-expensive); }
    code { background: var(--st-chip-bg); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    table { table-layout: auto; font-size: 12px; }
    th, td { text-align: right; padding: 6px 4px; border-bottom: 1px solid var(--st-border); white-space: nowrap; }
    th { white-space: normal; line-height: 1.2; vertical-align: bottom; }
    th:first-child, td:first-child { text-align: left; }
    th { font-size: 11px; color: var(--st-muted); font-weight: 600; }
    .scroll { overflow-x: auto; }
    @media (max-width: 480px) {
      body { padding: 12px 12px 24px; }
      .card { padding: 12px 12px; }
      .svgchart svg { height: 130px; }
      .tab { font-size: 13px; padding: 8px 7px; }
      .stats .chip { min-width: 0; flex: 1 1 calc(25% - 8px); }
    }
    .good { color: var(--st-cheap); font-weight: 600; }
    .bad { color: var(--st-expensive); font-weight: 600; }
    .btn {
      border: 1px solid var(--st-border); background: var(--st-chip-bg); color: var(--st-text);
      border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer;
    }
    .btn.primary { background: var(--st-accent); border-color: var(--st-accent); color: #fff; }
    .btn.danger { color: var(--st-expensive); }
    .form { display: grid; grid-template-columns: minmax(150px, 1fr) minmax(90px, 140px); gap: 10px 14px; align-items: center; max-width: 520px; }
    .form label { color: var(--st-text); }
    .form input[type=text], .form input[type=number] {
      width: 100%; padding: 7px 9px; font-size: 14px; border: 1px solid var(--st-border);
      border-radius: 8px; background: var(--st-bg); color: var(--st-text);
    }
    .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    .ok { color: var(--st-cheap); font-size: 13px; }
    .err { color: var(--st-expensive); font-size: 13px; }
    .status td:last-child { text-align: left; }
    .subhead { font-weight: 600; margin: 16px 0 4px; }
    .viewsw { display: flex; gap: 6px; margin: 4px 0 12px; }
    .pt-tabs .btn.active, .viewsw .btn.active { background: var(--st-accent); border-color: var(--st-accent); color: #fff; }
    .svgchart { position: relative; margin-top: 8px; }
    .svgchart svg { width: 100%; height: 170px; display: block; background: var(--st-chip-bg); border-radius: 8px; }
    .ylabels { position: absolute; left: 8px; top: 6px; bottom: 6px; display: flex; flex-direction: column; justify-content: space-between; font-size: 10px; color: var(--st-muted); pointer-events: none; }
    .swatch { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin-right: 4px; border-radius: 2px; }
    .bk-text { width: 100%; box-sizing: border-box; font-family: ui-monospace, Consolas, monospace; font-size: 11px; padding: 8px; border: 1px solid var(--st-border); border-radius: 8px; background: var(--st-bg); color: var(--st-text); }
    .warn.amber { background: rgba(251,140,0,.14); color: var(--st-text); }
    .st-line { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 12px; color: var(--st-muted); font-weight: 400; }
    .st-dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; background: var(--st-normal); }
    .st-dot.ok { background: var(--st-cheap); }
    .st-dot.warn { background: #fb8c00; }
    .st-dot.alarm { background: var(--st-expensive); }
    table.stat { width: 100%; border-collapse: collapse; margin-top: 10px; }
    table.stat td { padding: 7px 4px; border-top: 1px solid var(--st-border); vertical-align: top; font-size: 12px; }
    table.stat td:first-child { color: var(--st-muted); width: 34%; white-space: nowrap; }
    table.stat .warnTxt { color: #fb8c00; font-weight: 600; }
    table.stat .alarmTxt { color: var(--st-expensive); font-weight: 600; }
    .bk-check { display: flex; gap: 8px; align-items: center; margin: 10px 0 6px; font-size: 12px; }
    .manage-row { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 10px 0; border-top: 1px solid var(--st-border); }
    .manage-row:first-of-type { border-top: 0; }
    .manage-row select { padding: 7px 9px; font-size: 14px; border: 1px solid var(--st-border); border-radius: 8px; background: var(--st-bg); color: var(--st-text); min-width: 140px; }
    .manage-row .form { max-width: 360px; flex: 1; }
    .checklist { list-style: none; padding: 0; margin: 8px 0 0; }
    .checklist li { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 10px; }
    .checklist .mark { flex: 0 0 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--st-muted); text-align: center; line-height: 19px; font-size: 12px; margin-top: 1px; }
    .checklist li.done .mark { background: var(--st-cheap); border-color: var(--st-cheap); color: #fff; }
    .checklist .t { font-weight: 600; }
    .checklist .d { color: var(--st-muted); font-size: 13px; line-height: 1.4; }
    .period { border: 1px solid var(--st-border); border-radius: 10px; padding: 14px; margin-bottom: 12px; background: var(--st-bg); }
    .inline { display: flex; gap: 8px; align-items: center; }
    .inline input { flex: 1; min-width: 0; }
    .calc { margin: 10px 0 4px; padding: 10px; border-radius: 8px; background: var(--st-chip-bg); }
    .calc-row { display: grid; grid-template-columns: 1fr 100px 28px; gap: 6px; margin-bottom: 6px; }
    .calc-row input { width: 100%; padding: 6px 8px; font-size: 13px; border: 1px solid var(--st-border); border-radius: 6px; background: var(--st-bg); color: var(--st-text); }
    .calc-sum { font-weight: 600; margin: 8px 0; }
    details { margin-top: 10px; }
    summary { cursor: pointer; color: var(--st-muted); font-size: 13px; }
    .empty-note { margin: 14px 0; padding: 22px 16px; text-align: center; font-size: 15px; font-weight: 600; line-height: 1.4; border-radius: 10px; background: var(--st-chip-bg); color: var(--st-text); }
    .btn:disabled { opacity: .45; cursor: default; }
    .btn.small { padding: 4px 10px; font-size: 12px; }
    details.sec > summary { cursor: pointer; list-style: none; display: block; }
    details.sec > summary::-webkit-details-marker { display: none; }
    details.sec > summary h2 { display: inline; margin: 0; }
    details.sec > summary::before { content: '▸ '; color: var(--st-muted); }
    details.sec[open] > summary::before { content: '▾ '; }
    details.sec[open] > summary { margin-bottom: 12px; }
  </style>
</head>
<body>
  <p class="sub" id="p-sub"></p>

  <nav class="tabs">
    <button class="tab active" data-tab="overview" id="t-overview"></button>
    <button class="tab" data-tab="costs" id="t-costs"></button>
    <button class="tab" data-tab="settings" id="t-settings"></button>
    <button class="tab" data-tab="help" id="t-help"></button>
  </nav>

<div class="panel active" id="panel-overview">
    <div class="warn" id="status-banner" hidden></div>
    <div class="card" id="live-card">
      <h2 id="h2-live"></h2>
      <div id="live-root"><div class="no-device" id="initial-loading"></div></div>
    </div>

    <details class="card sec" id="status-card">
      <summary><h2 id="h2-status"></h2><div class="st-line"><span class="st-dot" id="status-dot"></span><span id="status-summary"></span></div></summary>
      <div id="status-body"></div>
    </details>
  </div>

  <div class="panel" id="panel-costs">
    <div class="card" id="backup-notice" hidden>
      <h2 id="h2-backup-found"></h2>
      <p class="sub" id="p-backup-found" style="margin-bottom:12px"></p>
      <button class="btn primary" id="btn-backup-restore-app"></button>
      <p class="err" id="backup-notice-err" hidden></p>
    </div>

    <div class="card">
      <h2 id="h2-costs"></h2>
      <div id="cost-root"><div class="no-device" id="cost-loading"></div></div>
    </div>

    <div class="card">
      <h2 id="h2-shadow"></h2>
      <p class="sub" id="p-shadow-intro" style="margin-bottom:10px"></p>
      <div id="shadow-root"></div>
    </div>
  </div>

  <div class="panel" id="panel-settings">
    <details class="card sec" open>
      <summary><h2 id="h2-setup"></h2></summary>
      <p class="sub" id="p-setup-intro" style="margin-bottom:8px"></p>
      <ol class="checklist" id="ol-setup"></ol>
    </details>

    <details class="card sec">
      <summary><h2 id="h2-general"></h2></summary>
      <div class="form">
        <label for="vat-input" id="l-vat"></label><input type="number" id="vat-input" min="0" max="100" step="0.1" />
      </div>
      <details style="margin-top:12px;">
        <summary id="sum-feedin"></summary>
        <div class="form" style="margin-top:10px;">
          <label for="feedin-mode" id="l-feedin-mode"></label>
          <select id="feedin-mode"><option value="reference"></option><option value="api"></option></select>
        </div>
        <p class="legend" id="p-feedin-hint"></p>
      </details>
      <p class="legend" id="p-vat-hint"></p>
      <div class="row">
        <button class="btn primary" id="btn-vat-save"></button>
        <span class="ok" id="vat-saved" hidden></span>
        <span class="err" id="vat-error" hidden></span>
      </div>
    </details>

    <details class="card sec">
      <summary><h2 id="h2-monitor"></h2></summary>
      <p class="legend" id="p-monitor-hint"></p>
      <div class="form" style="margin-top:12px;">
        <label for="monitor-hours" id="l-monitor-hours"></label>
        <input type="number" id="monitor-hours" min="0" max="48" step="0.25" />
      </div>
      <p class="legend" id="p-monitor-list"></p>
      <div id="monitor-list"></div>
      <p class="legend" id="p-monitor-timeline"></p>
      <label class="bk-check"><input type="checkbox" id="monitor-notify" /> <span id="l-monitor-notify"></span></label>
      <div class="row">
        <button class="btn primary" id="btn-monitor-save"></button>
        <span class="ok" id="monitor-saved" hidden></span>
        <span class="err" id="monitor-error" hidden></span>
      </div>
    </details>

    <details class="card sec">
      <summary><h2 id="h2-hourly"></h2></summary>
      <p class="legend" id="p-hourly-hint"></p>
      <div class="form" style="margin-top:12px;">
        <label for="hourly-unit" id="l-hourly-unit"></label>
        <select id="hourly-unit"><option value="rp"></option><option value="chf"></option></select>
        <label for="hourly-vat" id="l-hourly-vat"></label>
        <select id="hourly-vat"><option value="incl"></option><option value="excl"></option></select>
        <label for="hourly-decimals" id="l-hourly-decimals"></label>
        <input type="number" id="hourly-decimals" min="0" max="6" step="1" />
      </div>
      <p class="legend" id="p-hourly-example"></p>
      <div class="row">
        <button class="btn primary" id="btn-hourly-save"></button>
        <span class="ok" id="hourly-saved" hidden></span>
        <span class="err" id="hourly-error" hidden></span>
      </div>
    </details>

    <details class="card sec">
      <summary><h2 id="h2-appearance"></h2></summary>
      <div class="viewsw" id="theme-sw"></div>
      <p class="legend" id="p-theme-hint"></p>
    </details>

    <details class="card sec">
      <summary><h2 id="h2-ref"></h2></summary>
      <p class="sub" id="p-ref-hint" style="margin-bottom:14px"></p>
      <div id="ref-periods"></div>
      <div class="row">
        <button class="btn" id="btn-ref-add"></button>
        <button class="btn primary" id="btn-ref-save"></button>
        <span class="ok" id="ref-saved" hidden></span>
        <span class="err" id="ref-error" hidden></span>
      </div>
    </details>

    <details class="card sec">
      <summary><h2 id="h2-battery"></h2></summary>
      <p class="legend" id="p-battery-hint"></p>
      <div class="form" style="margin-top:12px;">
        <label for="bat-cap" id="l-bat-cap"></label><input type="number" id="bat-cap" min="1" step="0.1" />
        <label for="bat-pow" id="l-bat-pow"></label><input type="number" id="bat-pow" min="0.5" step="0.1" />

      if (typeof rp !== 'number' || !isFinite(rp)) return '–';
      var v = rp / 100;

      return (signed && v > 0 && t !== '0.00' ? '+' : '') + t;
