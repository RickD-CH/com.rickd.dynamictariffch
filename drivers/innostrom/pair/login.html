<!doctype html>
<html>
<head>
  <script type="text/javascript">
    // Text is hardcoded here (not via Homey.__()/locales) so this view cannot break on a
    // locale-loading quirk - it only needs Homey.getLanguage(), which is always available.
    const STRINGS = {
      en: {
        title: 'Innostrom access',
        intro: 'Connect a metering point with a dynamic tariff via the Innostrom API (Swisspower), e.g. AEW Classic Dynamic.',
        meteringCode: 'Metering point number',
        meteringCodePlaceholder: 'CH1234567890123456789012345678901',
        token: 'API token',
        tokenPlaceholder: 'Bearer token',
        environment: 'Environment',
        envProduction: 'Production',
        envTest: 'Test (public credentials)',
        useTestCredentials: 'Fill in test credentials',
        testCredentialsHint: 'The public test credentials let you try the app without a contract (constant prices).',
        submit: 'Connect',
        testing: 'Checking connection…',
        errorAuth: 'Invalid credentials: metering point number or token is wrong.',
        errorGeneric: 'Connection failed: ',
      },
      de: {
        title: 'Innostrom-Zugang',
        intro: 'Verbinde einen Messpunkt mit dynamischem Tarif über die Innostrom-API (Swisspower), z. B. AEW Classic Dynamic.',
        meteringCode: 'Messpunktnummer',
        meteringCodePlaceholder: 'CH1234567890123456789012345678901',
        token: 'API-Token',
        tokenPlaceholder: 'Bearer-Token',
        environment: 'Umgebung',
        envProduction: 'Produktiv',
        envTest: 'Test (öffentliche Zugangsdaten)',
        useTestCredentials: 'Test-Zugangsdaten einfügen',
        testCredentialsHint: 'Mit den öffentlichen Test-Zugangsdaten lässt sich die App ohne Vertrag ausprobieren (konstante Preise).',
        submit: 'Verbinden',
        testing: 'Verbindung wird geprüft…',
        errorAuth: 'Zugangsdaten ungültig: Messpunktnummer oder Token stimmen nicht.',
        errorGeneric: 'Verbindung fehlgeschlagen: ',
      },
    };

    function onHomeyReady(Homey) {
      try {
        const t = STRINGS[Homey.getLanguage()] || STRINGS.en;

        Homey.setTitle(t.title);

        const form = document.getElementById('form');
        const meteringCodeEl = document.getElementById('meteringCode');
        const tokenEl = document.getElementById('token');
        const environmentEl = document.getElementById('environment');
        const errorEl = document.getElementById('error');
        const submitBtn = document.getElementById('submit');
        const testCredsBtn = document.getElementById('useTestCredentials');

        document.getElementById('intro').textContent = t.intro;
        document.getElementById('meteringCodeLabel').textContent = t.meteringCode;
        meteringCodeEl.placeholder = t.meteringCodePlaceholder;
        document.getElementById('tokenLabel').textContent = t.token;
        tokenEl.placeholder = t.tokenPlaceholder;
        document.getElementById('environmentLabel').textContent = t.environment;
        document.getElementById('envProductionOption').textContent = t.envProduction;
        document.getElementById('envTestOption').textContent = t.envTest;
        testCredsBtn.textContent = t.useTestCredentials;
        document.getElementById('testCredentialsHint').textContent = t.testCredentialsHint;
        submitBtn.value = t.submit;

        testCredsBtn.addEventListener('click', () => {
          meteringCodeEl.value = 'CH1018601234500000000000000011642';
          tokenEl.value = '19d6ca0bb9bf4d8b6525440eead80da6';
          environmentEl.value = 'test';
        });

        form.addEventListener('submit', (e) => {
          e.preventDefault();
          errorEl.textContent = '';
          submitBtn.disabled = true;
          submitBtn.value = t.testing;

          const data = {
            meteringCode: meteringCodeEl.value.trim(),
            token: tokenEl.value.trim(),
            environment: environmentEl.value,
          };

          Homey.emit('login', data)
            .then(() => Homey.nextView())
            .catch((err) => {
              submitBtn.disabled = false;
              submitBtn.value = t.submit;
              errorEl.textContent = (err && err.message) || t.errorGeneric;
            });
        });

        Homey.ready();
      } catch (err) {
        // Surfaced instead of a silently blank/half-rendered form, in case something here
        // ever throws again (e.g. a future Homey SDK change) - visible beats mysterious.
        document.getElementById('error').textContent = 'Pairing view error: ' + (err && err.message ? err.message : err);
        try { Homey.ready(); } catch (e2) { /* nothing more we can do */ }
      }
    }
  </script>
  <style>
    body { padding: 16px; font-family: sans-serif; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input, select { width: 100%; box-sizing: border-box; padding: 8px; margin-top: 4px; }
    #error { color: #c0392b; margin-top: 12px; min-height: 1.2em; white-space: pre-wrap; }
    #testCredentialsHint { font-size: 0.85em; color: #666; margin-top: 4px; }
    #useTestCredentials { margin-top: 8px; }
    input[type=submit] { margin-top: 20px; }
  </style>
</head>
<body>
  <p id="intro"></p>
  <form id="form">
    <label id="meteringCodeLabel" for="meteringCode"></label>
    <input type="text" id="meteringCode" required />

    <label id="tokenLabel" for="token"></label>
    <input type="password" id="token" required />

    <label id="environmentLabel" for="environment"></label>
    <select id="environment">
      <option id="envProductionOption" value="production"></option>
      <option id="envTestOption" value="test"></option>
    </select>

    <button type="button" id="useTestCredentials"></button>
    <div id="testCredentialsHint"></div>

    <input type="submit" id="submit" value="Connect" />
  </form>
  <div id="error"></div>
</body>
</html>
